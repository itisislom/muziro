      notifyParent('CLIP_MOVED', { clipId: clipToMove.id, trackCount: tracks.length });
    }

    function updateClipsLayout() {
      if (maxDuration <= 0) return;
      const laneWidth = rulerBar.offsetWidth;

      tracks.forEach(track => {
        track.clips.forEach(clip => {
          if (!clip.element) return;
          const leftPx = (clip.startTime / maxDuration) * laneWidth;
          const widthPx = Math.max(4, (clip.duration / maxDuration) * laneWidth);
          clip.element.style.left = `${leftPx}px`;
          clip.element.style.width = `${widthPx}px`;

          drawClipWaveform(clip, clip.canvas);
          updateClipFades(clip, widthPx);
        });
      });

      if (typeof updateLiveRecordingVisuals === 'function') {
        updateLiveRecordingVisuals();
      }
    }

    function updateClipFades(clip, widthPx) {
      if (!clip || !clip.element) return;
      if (widthPx === undefined) {
        widthPx = clip.element.offsetWidth;
      }
      if (widthPx <= 0 || clip.duration <= 0) return;

      const heightPx = clip.element.offsetHeight || 64;

      const fadeIn = Math.max(0, Math.min(clip.duration, clip.fadeIn || 0));
      const fadeOut = Math.max(0, Math.min(clip.duration - fadeIn, clip.fadeOut || 0));

      const fadeInPx = Math.min(widthPx, (fadeIn / clip.duration) * widthPx);
      const fadeOutPx = Math.min(widthPx - fadeInPx, (fadeOut / clip.duration) * widthPx);

      const fadeInHandle = clip.element.querySelector('.fade-in-handle');
      const fadeInCurveHandle = clip.element.querySelector('.fade-in-curve-handle');
      const fadeOutHandle = clip.element.querySelector('.fade-out-handle');
      const fadeOutCurveHandle = clip.element.querySelector('.fade-out-curve-handle');
      const fadeInPath = clip.element.querySelector('.clip-fade-in-path');
      const fadeOutPath = clip.element.querySelector('.clip-fade-out-path');

      const inCurve = Math.max(-1, Math.min(1, clip.fadeInCurve || 0));
      const outCurve = Math.max(-1, Math.min(1, clip.fadeOutCurve || 0));

      // Update Fade In handle, curve handle, and path
      if (fadeInHandle) {
        fadeInHandle.style.left = `${fadeInPx}px`;
        if (fadeIn > 0.01) {
          fadeInHandle.classList.add('has-fade');
        } else {
          fadeInHandle.classList.remove('has-fade');
        }
        const tip = fadeInHandle.querySelector('.clip-fade-tooltip');
        if (tip) tip.textContent = `${fadeIn.toFixed(2)}s`;
      }

      if (fadeInPath) {
        if (fadeInPx > 1) {
          // Quadratic control point C:
          const cx = 0.5 * fadeInPx * (1 - inCurve);
          const cy = 0.5 * heightPx * (1 - inCurve);

          // Convert to cubic control points for SVG path from (fadeInPx, 0) to (0, heightPx):
          const cp1x = fadeInPx + (2 / 3) * (cx - fadeInPx);
          const cp1y = (2 / 3) * cy;
          const cp2x = (2 / 3) * cx;
          const cp2y = heightPx + (2 / 3) * (cy - heightPx);

          fadeInPath.setAttribute('d', `M 0,0 L ${fadeInPx.toFixed(1)},0 C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} 0,${heightPx} Z`);

          // Midpoint on the curve at t = 0.5:
          const midX = fadeInPx * (0.5 - 0.25 * inCurve);
          const midY = heightPx * (0.5 - 0.25 * inCurve);

          if (fadeInCurveHandle) {
            fadeInCurveHandle.style.left = `${midX.toFixed(1)}px`;
            fadeInCurveHandle.style.top = `${midY.toFixed(1)}px`;
            if (fadeInPx > 8) {
              fadeInCurveHandle.classList.add('has-fade');
            } else {
              fadeInCurveHandle.classList.remove('has-fade');
            }
            const tip = fadeInCurveHandle.querySelector('.clip-fade-tooltip');
            if (tip) {
              const pct = Math.round(inCurve * 100);
              tip.textContent = pct === 0 ? 'Linear' : (pct > 0 ? `+${pct}%` : `${pct}%`);
            }
          }
        } else {
          fadeInPath.setAttribute('d', '');
          if (fadeInCurveHandle) {
            fadeInCurveHandle.classList.remove('has-fade');
          }
        }
      }

      // Update Fade Out handle, curve handle, and path
      if (fadeOutHandle) {
        const handleX = widthPx - fadeOutPx;
        fadeOutHandle.style.left = `${handleX}px`;
        if (fadeOut > 0.01) {
          fadeOutHandle.classList.add('has-fade');
        } else {
          fadeOutHandle.classList.remove('has-fade');
        }
        const tip = fadeOutHandle.querySelector('.clip-fade-tooltip');
        if (tip) tip.textContent = `${fadeOut.toFixed(2)}s`;
      }

      if (fadeOutPath) {
        if (fadeOutPx > 1) {
          const startX = widthPx - fadeOutPx;
          // Quadratic control point C:
          const cx = startX + 0.5 * fadeOutPx * (1 + outCurve);
          const cy = 0.5 * heightPx * (1 - outCurve);

          // Convert to cubic control points for SVG path from (startX, 0) to (widthPx, heightPx):
          const cp1x = startX + (2 / 3) * (cx - startX);
          const cp1y = (2 / 3) * cy;
          const cp2x = widthPx + (2 / 3) * (cx - widthPx);
          const cp2y = heightPx + (2 / 3) * (cy - heightPx);

          fadeOutPath.setAttribute('d', `M ${startX.toFixed(1)},0 L ${widthPx},0 L ${widthPx},${heightPx} C ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${startX.toFixed(1)},0 Z`);

          // Midpoint on the curve at t = 0.5:
          const midX = startX + fadeOutPx * (0.5 + 0.25 * outCurve);
          const midY = heightPx * (0.5 - 0.25 * outCurve);

          if (fadeOutCurveHandle) {
            fadeOutCurveHandle.style.left = `${midX.toFixed(1)}px`;
            fadeOutCurveHandle.style.top = `${midY.toFixed(1)}px`;
            if (fadeOutPx > 8) {
              fadeOutCurveHandle.classList.add('has-fade');
            } else {
              fadeOutCurveHandle.classList.remove('has-fade');
            }
            const tip = fadeOutCurveHandle.querySelector('.clip-fade-tooltip');
            if (tip) {
              const pct = Math.round(outCurve * 100);
              tip.textContent = pct === 0 ? 'Linear' : (pct > 0 ? `+${pct}%` : `${pct}%`);
            }
          }
        } else {
          fadeOutPath.setAttribute('d', '');
          if (fadeOutCurveHandle) {
            fadeOutCurveHandle.classList.remove('has-fade');
          }
        }
      }
    }

    let isDraggingFade = false;
    let wasDraggingFadeJustNow = false;
    let wasDraggingFadeCurveJustNow = false;
    let draggedFadeClip = null;
    let draggedFadeType = null; // 'in' | 'out'
    let fadeDragStartX = 0;
    let fadeDragInitialVal = 0;

    function startFadeDrag(clip, type, e) {
      fadeDragInitialSnapshot = captureSnapshot();
      isDraggingFade = true;
      draggedFadeClip = clip;
      draggedFadeType = type;
      fadeDragStartX = e.clientX;
      fadeDragInitialVal = (type === 'in' ? (clip.fadeIn || 0) : (clip.fadeOut || 0));

      if (type === 'in') {
        const handle = clip.element.querySelector('.fade-in-handle');
        if (handle) handle.classList.add('is-dragging');
      } else {
        const handle = clip.element.querySelector('.fade-out-handle');
        if (handle) handle.classList.add('is-dragging');
      }

      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ew-resize';

      window.addEventListener('mousemove', onFadeDragMove);
      window.addEventListener('mouseup', onFadeDragEnd);
    }

    function onFadeDragMove(e) {
      if (!isDraggingFade || !draggedFadeClip || !draggedFadeClip.element || !e || e.clientX === undefined) return;

      const dx = e.clientX - fadeDragStartX;
      const clipWidthPx = draggedFadeClip.element.offsetWidth;
      if (clipWidthPx <= 0) return;

      const pxPerSec = clipWidthPx / draggedFadeClip.duration;
      const timeDelta = dx / pxPerSec;

      if (draggedFadeType === 'in') {
        let newFadeIn = Math.max(0, fadeDragInitialVal + timeDelta);
        const maxAllowed = Math.max(0, draggedFadeClip.duration - (draggedFadeClip.fadeOut || 0));
        newFadeIn = Math.min(maxAllowed, newFadeIn);
        draggedFadeClip.fadeIn = Math.round(newFadeIn * 1000) / 1000;
      } else {
        let newFadeOut = Math.max(0, fadeDragInitialVal - timeDelta);
        const maxAllowed = Math.max(0, draggedFadeClip.duration - (draggedFadeClip.fadeIn || 0));
        newFadeOut = Math.min(maxAllowed, newFadeOut);
        draggedFadeClip.fadeOut = Math.round(newFadeOut * 1000) / 1000;
      }

      updateClipFades(draggedFadeClip, clipWidthPx);
    }

    function onFadeDragEnd(e) {
      if (!isDraggingFade) return;

      if (draggedFadeClip && draggedFadeClip.element) {
        const hIn = draggedFadeClip.element.querySelector('.fade-in-handle');
        if (hIn) hIn.classList.remove('is-dragging');
        const hOut = draggedFadeClip.element.querySelector('.fade-out-handle');
        if (hOut) hOut.classList.remove('is-dragging');

        const finalVal = (draggedFadeType === 'in') ? (draggedFadeClip.fadeIn || 0) : (draggedFadeClip.fadeOut || 0);
        const didChange = Math.abs(finalVal - fadeDragInitialVal) > 0.005;
        if (didChange && fadeDragInitialSnapshot) {
          undoStack.push(fadeDragInitialSnapshot);
          if (undoStack.length > MAX_HISTORY_STEPS) undoStack.shift();
          redoStack.length = 0;
          notifyParent('HISTORY_STATE', { canUndo: true, canRedo: false });
        }
      }
      fadeDragInitialSnapshot = null;

      isDraggingFade = false;
      draggedFadeClip = null;
      draggedFadeType = null;
      document.body.style.userSelect = '';
      document.body.style.cursor = '';

      wasDraggingFadeJustNow = true;
      setTimeout(() => { wasDraggingFadeJustNow = false; }, 250);

      window.removeEventListener('mousemove', onFadeDragMove);
      window.removeEventListener('mouseup', onFadeDragEnd);

      if (isPlaying) {
        startAllSources(currentPlayheadTime);
      }
    }

    /* Fade Curve Tension Dragging Engine */
    let isDraggingFadeCurve = false;
    let draggedFadeCurveClip = null;
    let draggedFadeCurveType = null; // 'in' | 'out'
    let fadeCurveDragStartY = 0;
    let fadeCurveDragInitialVal = 0;
    let fadeCurveClipHeight = 64;
    let fadeCurveInitialSnapshot = null;

    function startFadeCurveDrag(clip, type, e) {
      isDraggingFadeCurve = true;
      draggedFadeCurveClip = clip;
      draggedFadeCurveType = type;
      fadeCurveDragStartY = e.clientY;
      fadeCurveDragInitialVal = (type === 'in' ? (clip.fadeInCurve || 0) : (clip.fadeOutCurve || 0));
      fadeCurveClipHeight = clip.element ? (clip.element.offsetHeight || 64) : 64;
      fadeCurveInitialSnapshot = captureSnapshot();

      const handle = type === 'in'
        ? clip.element.querySelector('.fade-in-curve-handle')
        : clip.element.querySelector('.fade-out-curve-handle');
      if (handle) handle.classList.add('is-dragging');

      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ns-resize';

      window.addEventListener('mousemove', onFadeCurveDragMove);
      window.addEventListener('mouseup', onFadeCurveDragEnd);
    }

    function onFadeCurveDragMove(e) {
      if (!isDraggingFadeCurve || !draggedFadeCurveClip) return;
      const deltaY = fadeCurveDragStartY - e.clientY;
      const sensitivity = 1 / (fadeCurveClipHeight * 0.45);
      let newCurve = Math.max(-1, Math.min(1, fadeCurveDragInitialVal + deltaY * sensitivity));
      newCurve = Math.round(newCurve * 100) / 100;

      if (draggedFadeCurveType === 'in') {
        draggedFadeCurveClip.fadeInCurve = newCurve;
      } else {
        draggedFadeCurveClip.fadeOutCurve = newCurve;
      }
      updateClipFades(draggedFadeCurveClip);
    }

    function onFadeCurveDragEnd(e) {
      if (!isDraggingFadeCurve) return;

      if (draggedFadeCurveClip && draggedFadeCurveClip.element) {
        const handle = draggedFadeCurveType === 'in'
          ? draggedFadeCurveClip.element.querySelector('.fade-in-curve-handle')
          : draggedFadeCurveClip.element.querySelector('.fade-out-curve-handle');
        if (handle) handle.classList.remove('is-dragging');

        const finalVal = (draggedFadeCurveType === 'in') ? (draggedFadeCurveClip.fadeInCurve || 0) : (draggedFadeCurveClip.fadeOutCurve || 0);
        if (Math.abs(finalVal - fadeCurveDragInitialVal) > 0.01 && fadeCurveInitialSnapshot) {
          undoStack.push(fadeCurveInitialSnapshot);
          if (undoStack.length > MAX_HISTORY_STEPS) undoStack.shift();
          redoStack.length = 0;
          notifyParent('HISTORY_STATE', { canUndo: true, canRedo: false });
          notifyParent('TIMELINE_MUTATED');
        }
      }
      fadeCurveInitialSnapshot = null;
      isDraggingFadeCurve = false;
      draggedFadeCurveClip = null;
      draggedFadeCurveType = null;
      document.body.style.userSelect = '';
      document.body.style.cursor = '';

      wasDraggingFadeCurveJustNow = true;
      setTimeout(() => { wasDraggingFadeCurveJustNow = false; }, 250);

      window.removeEventListener('mousemove', onFadeCurveDragMove);
      window.removeEventListener('mouseup', onFadeCurveDragEnd);

      if (isPlaying) {
        startAllSources(currentPlayheadTime);
      }
    }

    let isDraggingTrim = false;
    let draggedTrimClip = null;
    let draggedTrimSide = null; // 'left' | 'right'
    let draggedTrimTrack = null;
    let trimDragStartX = 0;
    let trimInitialStartTime = 0;
    let trimInitialDuration = 0;
    let trimInitialSourceOffset = 0;
    let trimInitialFadeIn = 0;
    let trimInitialFadeOut = 0;
    let trimInitialLeftPx = 0;
    let trimInitialWidthPx = 0;
    let trimPxPerSec = 0;
    let wasPlayingBeforeTrim = false;

    function startTrimDrag(clip, side, e) {
      if (e.button !== 0) return;
      e.stopPropagation();

      trimDragInitialSnapshot = captureSnapshot();

      if (!clip.sourceBuffer) {
        clip.sourceBuffer = clip.buffer;
        clip.sourceOffset = 0;
      }
      if (clip.sourceOffset === undefined) {
        clip.sourceOffset = 0;
      }

      isDraggingTrim = true;
      draggedTrimClip = clip;
      draggedTrimSide = side;
      trimDragStartX = e.clientX;

      trimInitialStartTime = clip.startTime || 0;
      trimInitialDuration = clip.duration || 0;
      trimInitialSourceOffset = clip.sourceOffset || 0;
      trimInitialFadeIn = clip.fadeIn || 0;
      trimInitialFadeOut = clip.fadeOut || 0;

      draggedTrimTrack = null;
      for (const t of tracks) {
        if (t.clips && t.clips.includes(clip)) {
          draggedTrimTrack = t;
          break;
        }
      }

      const laneWidth = rulerBar.offsetWidth;
      trimPxPerSec = maxDuration > 0 ? (laneWidth / maxDuration) : 100;
      trimInitialLeftPx = (trimInitialStartTime / maxDuration) * laneWidth;
      trimInitialWidthPx = Math.max(4, (trimInitialDuration / maxDuration) * laneWidth);

      // Fix Bug 1: Do NOT clear or redraw the canvas on mousedown!
      // Simply lock canvas style width to initial width and left to 0px so it remains 100% frozen.
      if (clip.canvas) {
        clip.canvas.style.width = `${trimInitialWidthPx}px`;
        clip.canvas.style.left = '0px';
      }

      const handle = clip.element ? clip.element.querySelector(side === 'left' ? '.trim-handle-left' : '.trim-handle-right') : null;
      if (handle) handle.classList.add('is-dragging');
      if (clip.element) clip.element.classList.add('is-trimming');

      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';

      if (isPlaying) {
        wasPlayingBeforeTrim = true;
        stopAllSources();
      } else {
        wasPlayingBeforeTrim = false;
      }

      selectClip(clip.id);

      window.addEventListener('mousemove', onTrimDragMove);
      window.addEventListener('mouseup', onTrimDragEnd);
    }

    function onTrimDragMove(e) {
      if (!isDraggingTrim || !draggedTrimClip || !draggedTrimClip.element || !e || e.clientX === undefined) return;

      const dx = e.clientX - trimDragStartX;
      const laneWidth = rulerBar.offsetWidth;
      if (laneWidth <= 0 || maxDuration <= 0) return;

      const deltaTime = (dx / laneWidth) * maxDuration;
      const clip = draggedTrimClip;
      const minDuration = 0.05;

      if (draggedTrimSide === 'left') {
        let leftBound = Math.max(0, trimInitialStartTime - trimInitialSourceOffset);
        if (draggedTrimTrack && draggedTrimTrack.clips) {
          for (const other of draggedTrimTrack.clips) {
            if (other === clip) continue;
            const otherEnd = (other.startTime || 0) + other.duration;
            if (other.startTime < trimInitialStartTime && otherEnd > leftBound) {
              leftBound = otherEnd;
            }
          }
        }
        const rightBound = trimInitialStartTime + trimInitialDuration - minDuration;
        const newStartTime = Math.max(leftBound, Math.min(rightBound, trimInitialStartTime + deltaTime));
        const actualDelta = newStartTime - trimInitialStartTime;
        const newDuration = trimInitialDuration - actualDelta;
        const newSourceOffset = trimInitialSourceOffset + actualDelta;

        clip.startTime = Math.round(newStartTime * 1000) / 1000;
        clip.duration = Math.round(newDuration * 1000) / 1000;
        clip.sourceOffset = Math.round(newSourceOffset * 1000) / 1000;

        // Fix Bug 2: Fade cannot exceed initial fade or duration, and never becomes positive if initially 0
        clip.fadeIn = Math.max(0, Math.min(trimInitialFadeIn, clip.duration));
        clip.fadeOut = Math.max(0, Math.min(trimInitialFadeOut, clip.duration - (clip.fadeIn || 0)));

        // Fix Bug 1: Keep waveform completely stationary on the timeline
        if (clip.canvas) {
          if (actualDelta >= 0) {
            const actualDeltaPx = (actualDelta / maxDuration) * laneWidth;
            clip.canvas.style.left = `${-actualDeltaPx}px`;
            clip.canvas.style.width = `${trimInitialWidthPx}px`;
          } else {
            // Extended left beyond initial start time into source audio: draw at exact timeline scale
            const canvasW = Math.max(4, Math.round(clip.duration * trimPxPerSec));
            const canvasH = clip.element.offsetHeight || 64;
            clip.canvas.style.left = '0px';
            clip.canvas.style.width = '100%';
            drawWaveformRange(clip.canvas, clip.sourceBuffer, clip.sourceOffset, clip.duration, canvasW, canvasH);
          }
        }

      } else {
        const sourceTotalDur = (clip.sourceBuffer ? clip.sourceBuffer.duration : clip.duration);
        const maxSourceAvail = Math.max(minDuration, sourceTotalDur - trimInitialSourceOffset);
        let rightBoundTime = trimInitialStartTime + maxSourceAvail;

        if (draggedTrimTrack && draggedTrimTrack.clips) {
          for (const other of draggedTrimTrack.clips) {
            if (other === clip) continue;
            if (other.startTime >= trimInitialStartTime && other.startTime < rightBoundTime) {
              rightBoundTime = other.startTime;
            }
          }
        }
        const maxDurationAllowed = Math.max(minDuration, rightBoundTime - trimInitialStartTime);
        const newDuration = Math.max(minDuration, Math.min(maxDurationAllowed, trimInitialDuration + deltaTime));

        clip.duration = Math.round(newDuration * 1000) / 1000;

        // Fix Bug 2: Fade cannot exceed initial fade or duration, and never becomes positive if initially 0
        clip.fadeIn = Math.max(0, Math.min(trimInitialFadeIn, clip.duration));
        clip.fadeOut = Math.max(0, Math.min(trimInitialFadeOut, clip.duration - (clip.fadeIn || 0)));

        // Fix Bug 1: Keep waveform completely stationary on the timeline
        if (clip.canvas) {
          if (newDuration <= trimInitialDuration) {
            clip.canvas.style.left = '0px';
            clip.canvas.style.width = `${trimInitialWidthPx}px`;
          } else {
            // Extended right beyond initial duration into source audio: draw at exact timeline scale
            const canvasW = Math.max(4, Math.round(clip.duration * trimPxPerSec));
            const canvasH = clip.element.offsetHeight || 64;
            clip.canvas.style.left = '0px';
            clip.canvas.style.width = '100%';
            drawWaveformRange(clip.canvas, clip.sourceBuffer, clip.sourceOffset, clip.duration, canvasW, canvasH);
          }
        }

        if (clip.startTime + clip.duration > maxDuration) {
          freeTimelineDuration = Math.max(freeTimelineDuration, (clip.startTime + clip.duration) * 1.2);
          maxDuration = freeTimelineDuration;
          applyZoom();
        }
      }

      const leftPx = (clip.startTime / maxDuration) * rulerBar.offsetWidth;
      const widthPx = Math.max(4, (clip.duration / maxDuration) * rulerBar.offsetWidth);
      clip.element.style.left = `${leftPx}px`;
      clip.element.style.width = `${widthPx}px`;

      const tip = clip.element.querySelector(draggedTrimSide === 'left' ? '.trim-handle-left .clip-trim-tooltip' : '.trim-handle-right .clip-trim-tooltip');
      if (tip) {
        tip.textContent = `${clip.duration.toFixed(2)}s`;
      }

      updateClipFades(clip, widthPx);

      const colRect = rightColumn.getBoundingClientRect();
      if (e.clientX > colRect.right - 35) {
        rightColumn.scrollLeft += 10;
      } else if (e.clientX < colRect.left + 35) {
        rightColumn.scrollLeft = Math.max(0, rightColumn.scrollLeft - 10);
      }
    }

    function onTrimDragEnd(e) {
      if (!isDraggingTrim || !draggedTrimClip) return;
      e = e || {};

      window.removeEventListener('mousemove', onTrimDragMove);
      window.removeEventListener('mouseup', onTrimDragEnd);

      document.body.style.userSelect = '';
      document.body.style.cursor = '';

      const clip = draggedTrimClip;
      const track = draggedTrimTrack;

      if (clip.element) {
        if (clip.canvas) {
          clip.canvas.style.left = '0px';
          clip.canvas.style.width = '100%';
        }
        const handle = clip.element.querySelector(draggedTrimSide === 'left' ? '.trim-handle-left' : '.trim-handle-right');
        if (handle) handle.classList.remove('is-dragging');
        clip.element.classList.remove('is-trimming');
      }

      if (clip.sourceBuffer) {
        const startSec = Math.max(0, clip.sourceOffset || 0);
        const endSec = Math.min(clip.sourceBuffer.duration, startSec + clip.duration);
        const newBuf = sliceAudioBuffer(audioContext, clip.sourceBuffer, startSec, endSec);
        if (newBuf) {
          clip.buffer = newBuf;
          clip.duration = newBuf.duration;
        }
      }

      const didTrim = (clip.startTime !== trimInitialStartTime) || (clip.duration !== trimInitialDuration);
      if (didTrim && trimDragInitialSnapshot) {
        undoStack.push(trimDragInitialSnapshot);
        if (undoStack.length > MAX_HISTORY_STEPS) undoStack.shift();
        redoStack.length = 0;
        notifyParent('HISTORY_STATE', { canUndo: true, canRedo: false });
      }
      trimDragInitialSnapshot = null;

      isDraggingTrim = false;
      draggedTrimClip = null;
      draggedTrimSide = null;
      draggedTrimTrack = null;

      if (track) {
        const savedScrollLeft = rightColumn.scrollLeft;
        renderTrackClips(track);
        recalcMaxDuration();
        updateClipsLayout();
        rightColumn.scrollLeft = savedScrollLeft;
      }

      selectClip(clip.id);

      if (wasPlayingBeforeTrim) {
        wasPlayingBeforeTrim = false;
        startAllSources(currentPlayheadTime);
      }

      notifyParent('CLIP_TRIMMED', { clipId: clip.id, startTime: clip.startTime, duration: clip.duration });
    }

    function drawWaveformRange(canvas, buffer, offsetSec, durationSec, widthPx, heightPx) {
      if (!canvas || !buffer) return;
      const w = Math.max(4, Math.round(widthPx));
      const h = Math.max(10, Math.round(heightPx));

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);

      const ctx = canvas.getContext('2d');
      ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      ctx.clearRect(0, 0, w, h);

      const rawData = buffer.getChannelData(0);
      const totalSamples = rawData.length;
      const sampleRate = buffer.sampleRate;

      ctx.fillStyle = '#111111';
      const barStep = 3;
      const totalBars = Math.floor(w / barStep);

      for (let i = 0; i < totalBars; i++) {
        const x = i * barStep;
        const tStart = offsetSec + (i / totalBars) * durationSec;
        const tEnd = offsetSec + ((i + 1) / totalBars) * durationSec;

        const idxStart = Math.max(0, Math.floor(tStart * sampleRate));
        const idxEnd = Math.min(totalSamples, Math.ceil(tEnd * sampleRate));

        let max = 0;
        const count = idxEnd - idxStart;
        const stride = Math.max(1, Math.floor(count / 30));
        for (let s = idxStart; s < idxEnd; s += stride) {
          const val = Math.abs(rawData[s] || 0);
          if (val > max) max = val;
        }

        const barHeight = Math.max(2, max * (h * 0.85));
        const y = (h - barHeight) / 2;
        ctx.fillRect(x, y, 2, barHeight);
      }
    }

    function drawClipWaveform(clip, canvas) {
      if (!canvas || !clip.element) return;
      const w = clip.element.offsetWidth;
      const h = clip.element.offsetHeight || 64;
      if (w <= 0 || h <= 0) return;

      canvas.style.left = '0px';
      canvas.style.width = '100%';

      drawWaveformRange(canvas, clip.buffer, 0, clip.duration, w, h);
    }

    function sliceAudioBuffer(ctx, origBuffer, startSec, endSec) {
      const sampleRate = origBuffer.sampleRate;
      const numChannels = origBuffer.numberOfChannels;
      const startSample = Math.max(0, Math.floor(startSec * sampleRate));
      const endSample = Math.min(origBuffer.length, Math.floor(endSec * sampleRate));
      const frameCount = endSample - startSample;

      if (frameCount <= 0) return null;

      const newBuffer = ctx.createBuffer(numChannels, frameCount, sampleRate);
      for (let ch = 0; ch < numChannels; ch++) {
        const srcData = origBuffer.getChannelData(ch);
        const destData = newBuffer.getChannelData(ch);
        destData.set(srcData.subarray(startSample, endSample));
      }
      return newBuffer;
    }

    const selectedClipIds = new Set();
    let selectedClipId = null;

    function updateClipVisualSelection(clipId, isSelected) {
      const el = document.getElementById(`clip-${clipId}`);
      if (!el) return;
      if (isSelected) {
        el.classList.remove('is-selected');
        void el.offsetWidth;
        el.classList.add('is-selected');
      } else {
        el.classList.remove('is-selected');
      }
    }

    function selectClip(clipId, isAdditive = false) {
      if (!isAdditive) {
        selectedClipIds.forEach(id => {
          if (id !== clipId) updateClipVisualSelection(id, false);
        });
        selectedClipIds.clear();
      }

      if (clipId) {
        selectedClipIds.add(clipId);
        selectedClipId = clipId;
        updateClipVisualSelection(clipId, true);
        const parentTrack = tracks.find(t => t.clips && t.clips.some(c => c.id === clipId));
        if (parentTrack) {
          selectTrack(parentTrack.id);
        }
        notifyParent('CLIPS_SELECTED', { ids: Array.from(selectedClipIds), count: selectedClipIds.size, primaryId: clipId });
        notifyParent('CLIP_SELECTED', { id: clipId });
      } else {
        if (!isAdditive) {
          selectedClipId = null;
          notifyParent('CLIP_DESELECTED');
        }
      }
    }

    function selectMultipleClips(clipIds, isAdditive = false) {
      if (!isAdditive) {
        selectedClipIds.forEach(id => updateClipVisualSelection(id, false));
        selectedClipIds.clear();
      }
      (clipIds || []).forEach(id => {
        selectedClipIds.add(id);
        updateClipVisualSelection(id, true);
      });
      selectedClipId = selectedClipIds.size > 0 ? Array.from(selectedClipIds)[selectedClipIds.size - 1] : null;
      if (selectedClipIds.size > 0) {
        notifyParent('CLIPS_SELECTED', { ids: Array.from(selectedClipIds), count: selectedClipIds.size, primaryId: selectedClipId });
        notifyParent('CLIP_SELECTED', { id: selectedClipId });
      } else {
        notifyParent('CLIP_DESELECTED');
      }
    }

    function toggleClipSelection(clipId) {
      if (selectedClipIds.has(clipId)) {
        selectedClipIds.delete(clipId);
        updateClipVisualSelection(clipId, false);
        selectedClipId = selectedClipIds.size > 0 ? Array.from(selectedClipIds)[selectedClipIds.size - 1] : null;
      } else {
        selectedClipIds.add(clipId);
        updateClipVisualSelection(clipId, true);
        selectedClipId = clipId;
      }
      if (selectedClipIds.size > 0) {
        notifyParent('CLIPS_SELECTED', { ids: Array.from(selectedClipIds), count: selectedClipIds.size, primaryId: selectedClipId });
        notifyParent('CLIP_SELECTED', { id: selectedClipId });
      } else {
        notifyParent('CLIP_DESELECTED');
      }
    }

    function clearClipSelection() {
      if (selectedClipIds.size === 0 && !selectedClipId) return;
      selectedClipIds.forEach(id => updateClipVisualSelection(id, false));
      selectedClipIds.clear();
      selectedClipId = null;
      notifyParent('CLIP_DESELECTED');
    }

    function selectAllClips() {
      const allIds = [];
      tracks.forEach(t => {
        (t.clips || []).forEach(c => allIds.push(c.id));
      });
      selectMultipleClips(allIds, false);
      if (allIds.length > 0) {
        showTimelineToast(`Selected ${allIds.length} clip${allIds.length > 1 ? 's' : ''}`);
      }
    }

    function splitSelectedTrack() {
      if (tracks.length === 0) return;

      let targetClip = null;
      let parentTrack = null;

      if (selectedClipId) {
        for (const t of tracks) {
          const c = t.clips.find(x => x.id === selectedClipId);
          if (c) { targetClip = c; parentTrack = t; break; }
        }
      }

      if (!targetClip) {
        for (const t of tracks) {
          const c = t.clips.find(x => currentPlayheadTime >= x.startTime && currentPlayheadTime <= x.startTime + x.duration);
          if (c) { targetClip = c; parentTrack = t; break; }
        }
      }

      if (!targetClip && tracks.length > 0 && tracks[0].clips.length > 0) {
        parentTrack = tracks[0];
        targetClip = parentTrack.clips[0];
      }

      if (!targetClip || !parentTrack || targetClip.duration <= 0.2) return;

      let cutOffset = targetClip.duration / 2;
      if (currentPlayheadTime > targetClip.startTime + 0.1 && currentPlayheadTime < targetClip.startTime + targetClip.duration - 0.1) {
        cutOffset = currentPlayheadTime - targetClip.startTime;
      }

      const buf1 = sliceAudioBuffer(audioContext, targetClip.buffer, 0, cutOffset);
      const buf2 = sliceAudioBuffer(audioContext, targetClip.buffer, cutOffset, targetClip.duration);
      if (!buf1 || !buf2) return;

      pushHistorySnapshot();

      const wasPlaying = isPlaying;
      if (isPlaying) stopAllSources();

      const targetSourceBuffer = targetClip.sourceBuffer || targetClip.buffer;
      const targetSourceOffset = targetClip.sourceOffset || 0;

      const clip1 = {
        id: 'clip_' + Date.now() + '_1',
        name: targetClip.name,
        startTime: targetClip.startTime,
        duration: buf1.duration,
        buffer: buf1,
        sourceBuffer: targetSourceBuffer,
        sourceOffset: targetSourceOffset,
        fadeIn: Math.min(targetClip.fadeIn || 0, buf1.duration),
        fadeOut: 0,
        fadeInCurve: targetClip.fadeInCurve || 0,
        fadeOutCurve: 0
      };

      const clip2 = {
        id: 'clip_' + Date.now() + '_2',
        name: targetClip.name,
        startTime: targetClip.startTime + cutOffset,
        duration: buf2.duration,
        buffer: buf2,
        sourceBuffer: targetSourceBuffer,
        sourceOffset: targetSourceOffset + cutOffset,
        fadeIn: 0,
        fadeOut: Math.min(targetClip.fadeOut || 0, buf2.duration),
        fadeInCurve: 0,
        fadeOutCurve: targetClip.fadeOutCurve || 0
      };

      const clipIdx = parentTrack.clips.indexOf(targetClip);
      parentTrack.clips.splice(clipIdx, 1, clip1, clip2);

      const savedScrollLeft = rightColumn.scrollLeft;
      renderTrackClips(parentTrack);
      recalcMaxDuration();
      updateClipsLayout();
      rightColumn.scrollLeft = savedScrollLeft;
      selectClip(clip2.id);

      if (wasPlaying) {
        startAllSources(currentPlayheadTime);
      }

      notifyParent('CLIP_SPLIT', { trackId: parentTrack.id, clip1: clip1.id, clip2: clip2.id });
    }

    function getTargetClipAtPlayhead() {
      if (tracks.length === 0) return null;

      // 1. If a clip is selected and playhead is strictly inside it
      if (selectedClipId) {
        for (const t of tracks) {
          const c = t.clips.find(x => x.id === selectedClipId);
          if (c && currentPlayheadTime > c.startTime + 0.02 && currentPlayheadTime < c.startTime + c.duration - 0.02) {
            return { track: t, clip: c };
          }
        }
      }

      // 2. Otherwise find clip on any track under playhead
      for (const t of tracks) {
        const c = t.clips.find(x => currentPlayheadTime > x.startTime + 0.02 && currentPlayheadTime < x.startTime + x.duration - 0.02);
        if (c) {
          return { track: t, clip: c };
        }
      }

      return null;
    }

    function trimStartToPlayhead() {
      const target = getTargetClipAtPlayhead();
      if (!target) return;

      const parentTrack = target.track;
      const targetClip = target.clip;

      const cutOffset = currentPlayheadTime - targetClip.startTime;
      if (cutOffset <= 0.02 || (targetClip.duration - cutOffset) <= 0.02) return;

      const newBuffer = sliceAudioBuffer(audioContext, targetClip.buffer, cutOffset, targetClip.duration);
      if (!newBuffer) return;

      pushHistorySnapshot();

      const wasPlaying = isPlaying;
      if (isPlaying) stopAllSources();

      if (!targetClip.sourceBuffer) {
        targetClip.sourceBuffer = targetClip.buffer;
        targetClip.sourceOffset = 0;
      }
      targetClip.sourceOffset = (targetClip.sourceOffset || 0) + cutOffset;
      targetClip.startTime = currentPlayheadTime;
      targetClip.duration = newBuffer.duration;
      targetClip.buffer = newBuffer;
      targetClip.fadeIn = 0;
      targetClip.fadeOut = Math.min(targetClip.fadeOut || 0, newBuffer.duration);

      const savedScrollLeft = rightColumn.scrollLeft;
      renderTrackClips(parentTrack);
      recalcMaxDuration();
      updateClipsLayout();
      rightColumn.scrollLeft = savedScrollLeft;
      selectClip(targetClip.id);

      if (wasPlaying) {
        startAllSources(currentPlayheadTime);
      }

      notifyParent('CLIP_TRIMMED_START', { trackId: parentTrack.id, clipId: targetClip.id, newStartTime: targetClip.startTime, newDuration: targetClip.duration });
    }

    function trimEndToPlayhead() {
      const target = getTargetClipAtPlayhead();
      if (!target) return;

      const parentTrack = target.track;
      const targetClip = target.clip;

      const cutOffset = currentPlayheadTime - targetClip.startTime;
      if (cutOffset <= 0.02 || (targetClip.duration - cutOffset) <= 0.02) return;

      const newBuffer = sliceAudioBuffer(audioContext, targetClip.buffer, 0, cutOffset);
      if (!newBuffer) return;

      pushHistorySnapshot();

      const wasPlaying = isPlaying;
      if (isPlaying) stopAllSources();

      if (!targetClip.sourceBuffer) {
        targetClip.sourceBuffer = targetClip.buffer;
        targetClip.sourceOffset = 0;
      }
      targetClip.duration = newBuffer.duration;
      targetClip.buffer = newBuffer;
      targetClip.fadeIn = Math.min(targetClip.fadeIn || 0, newBuffer.duration);
      targetClip.fadeOut = 0;

      const savedScrollLeft = rightColumn.scrollLeft;
      renderTrackClips(parentTrack);
      recalcMaxDuration();
      updateClipsLayout();
      rightColumn.scrollLeft = savedScrollLeft;
      selectClip(targetClip.id);

      if (wasPlaying) {
        startAllSources(currentPlayheadTime);
      }

      notifyParent('CLIP_TRIMMED_END', { trackId: parentTrack.id, clipId: targetClip.id, newStartTime: targetClip.startTime, newDuration: targetClip.duration });
    }

    function deleteSelectedClip() {
      if ((!selectedClipId && selectedClipIds.size === 0) || tracks.length === 0) return;

      const idsToDelete = new Set(selectedClipIds);
      if (selectedClipId) idsToDelete.add(selectedClipId);
      if (idsToDelete.size === 0) return;

      pushHistorySnapshot();

      const wasPlaying = isPlaying;
      if (isPlaying) {
        stopAllSources();
      }

      const count = idsToDelete.size;
      const affectedTracks = new Set();
      const tracksToRemove = [];

      tracks.forEach(t => {
        if (!t.clips) return;
        const initialCount = t.clips.length;
        t.clips = t.clips.filter(c => !idsToDelete.has(c.id));
        if (t.clips.length !== initialCount) {
          affectedTracks.add(t);
          if (t.clips.length === 0) {
            tracksToRemove.push(t);
          }
        }
      });

      tracksToRemove.forEach(t => {
        const tIdx = tracks.indexOf(t);
        if (tIdx !== -1) tracks.splice(tIdx, 1);
        const headerEl = document.getElementById(`header-${t.id}`);
        if (headerEl) headerEl.remove();
        const laneEl = document.getElementById(`lane-${t.id}`);
        if (laneEl) laneEl.remove();
        affectedTracks.delete(t);
      });

      affectedTracks.forEach(t => {
        renderTrackClips(t);
      });

      clearClipSelection();

      if (tracks.length === 0) {
        emptyState.style.display = 'flex';
        globalPlayhead.style.display = 'none';
        maxDuration = 0;
        freeTimelineDuration = 0;
        currentPlayheadTime = 0;
        updatePlayheadPosition();
        notifyParent('ALL_TRACKS_REMOVED');
        notifyParent('TIME_UPDATE', { time: 0 });
      } else {
        const savedScrollLeft = rightColumn.scrollLeft;
        recalcMaxDuration();
        applyZoom();
        rightColumn.scrollLeft = Math.min(savedScrollLeft, Math.max(0, rightColumn.scrollWidth - rightColumn.clientWidth));
      }

      if (wasPlaying && tracks.length > 0) {
        startAllSources(currentPlayheadTime);
      }

      showTimelineToast(count > 1 ? `Deleted ${count} clips` : `Clip deleted`);
      notifyParent('CLIP_DELETED', { count: count });
    }

    let trackToDelete = null;

    function confirmDeleteTrack(track) {
      if (!track) return;
      trackToDelete = track;
      const modal = document.getElementById('confirm-modal-overlay');
      const modalText = document.getElementById('confirm-modal-text');
      if (modalText) {
        modalText.textContent = `Are you sure you want to delete "${track.name || 'this track'}"? This action cannot be undone.`;
      }
      if (modal) {
        modal.classList.add('is-active');
        modal.setAttribute('aria-hidden', 'false');
      }
    }

    function closeConfirmModal() {
      trackToDelete = null;
      const modal = document.getElementById('confirm-modal-overlay');
      if (modal) {
        modal.classList.remove('is-active');
        modal.setAttribute('aria-hidden', 'true');
      }
    }

    function deleteTrack(track) {
      if (!track) return;
      const trackIdx = tracks.indexOf(track);
      if (trackIdx === -1) return;

      pushHistorySnapshot();

      const wasPlaying = isPlaying;
      if (isPlaying) {
        stopAllSources();
      }

      // If clips on this track were selected, clean them from selection
      if (track.clips) {
        track.clips.forEach(c => {
          if (selectedClipIds.has(c.id)) {
            selectedClipIds.delete(c.id);
          }
        });
        if (selectedClipId && track.clips.some(c => c.id === selectedClipId)) {
          selectedClipId = selectedClipIds.size > 0 ? Array.from(selectedClipIds)[selectedClipIds.size - 1] : null;
        }
      }

      // Disconnect gain node if exists
      if (track.gainNode) {
        try {
          track.gainNode.disconnect();
        } catch (e) {}
      }

      // Remove from tracks array
      tracks.splice(trackIdx, 1);

      // Remove DOM elements
      const headerEl = document.getElementById(`header-${track.id}`);
      if (headerEl) headerEl.remove();

      const laneEl = document.getElementById(`lane-${track.id}`);
      if (laneEl) laneEl.remove();

      if (tracks.length === 0) {
        emptyState.style.display = 'flex';
        globalPlayhead.style.display = 'none';
        maxDuration = 0;
        freeTimelineDuration = 0;
        currentPlayheadTime = 0;
        updatePlayheadPosition();
        notifyParent('ALL_TRACKS_REMOVED');
        notifyParent('TIME_UPDATE', { time: 0 });
      } else {
        const savedScrollLeft = rightColumn.scrollLeft;
        recalcMaxDuration();
        applyZoom();
        rightColumn.scrollLeft = Math.min(savedScrollLeft, Math.max(0, rightColumn.scrollWidth - rightColumn.clientWidth));
      }

      if (wasPlaying && tracks.length > 0) {
        startAllSources(currentPlayheadTime);
      }

      notifyParent('TRACK_DELETED', { trackId: track.id });
    }

    // ==========================================
    // UNDO / REDO ENGINE
    // ==========================================
    const undoStack = [];
    const redoStack = [];
    const MAX_HISTORY_STEPS = 50;
    let isPerformingUndoRedo = false;

    // Snapshot variables for drags
    let dragInitialSnapshot = null;
    let trimDragInitialSnapshot = null;
    let fadeDragInitialSnapshot = null;
    let trackDragInitialSnapshot = null;

    function showTimelineToast(message) {
      let toast = document.getElementById('timeline-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'timeline-toast';
        toast.className = 'timeline-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.add('is-active');
      if (toast._hideTimeout) clearTimeout(toast._hideTimeout);
      toast._hideTimeout = setTimeout(() => {
        toast.classList.remove('is-active');
      }, 1200);
    }

    function captureSnapshot() {
      return {
        freeTimelineDuration: freeTimelineDuration,
        maxDuration: maxDuration,
        selectedClipId: selectedClipId,
        selectedClipIds: Array.from(selectedClipIds),
        tracks: tracks.map(t => ({
          id: t.id,
          name: t.name,
          volume: t.volume !== undefined ? t.volume : 100,
          clips: (t.clips || []).map(c => ({
            id: c.id,
            name: c.name,
            startTime: c.startTime,
            duration: c.duration,
            buffer: c.buffer,
            sourceBuffer: c.sourceBuffer || c.buffer,
            sourceOffset: c.sourceOffset || 0,
            fadeIn: c.fadeIn || 0,
            fadeOut: c.fadeOut || 0,
            fadeInCurve: c.fadeInCurve || 0,
            fadeOutCurve: c.fadeOutCurve || 0,
            reverb: c.reverb || 0
          }))
        }))
      };
    }

    function pushHistorySnapshot() {
      if (isPerformingUndoRedo) return;
      const snapshot = captureSnapshot();
      undoStack.push(snapshot);
      if (undoStack.length > MAX_HISTORY_STEPS) {
        undoStack.shift();
      }
      redoStack.length = 0;
      notifyParent('HISTORY_STATE', { canUndo: undoStack.length > 0, canRedo: false });
      notifyParent('TIMELINE_MUTATED');
    }

    function restoreSnapshot(snapshot) {
      if (!snapshot) return;

      const wasPlaying = isPlaying;
      if (isPlaying) {
        stopAllSources();
      }

      // 1. Disconnect and clean up existing tracks
      tracks.forEach(t => {
        if (t.gainNode) {
          try { t.gainNode.disconnect(); } catch (e) {}
        }
      });

      // 2. Clear DOM lists
      headersList.innerHTML = '';
      wavesList.innerHTML = '';
      tracks.length = 0;

      // 3. Rebuild tracks
      (snapshot.tracks || []).forEach(sTrack => {
        const gainNode = audioContext.createGain();
        const vol = sTrack.volume !== undefined ? sTrack.volume : 100;
        gainNode.gain.value = vol / 100;
        gainNode.connect(audioContext.destination);

        const newTrack = {
          id: sTrack.id,
          name: sTrack.name,
          duration: 0,
          gainNode: gainNode,
          volume: vol,
          clips: (sTrack.clips || []).map(sClip => ({
            id: sClip.id,
            name: sClip.name,
            startTime: sClip.startTime,
            duration: sClip.duration,
            buffer: sClip.buffer,
            sourceBuffer: sClip.sourceBuffer || sClip.buffer,
            sourceOffset: sClip.sourceOffset || 0,
            fadeIn: sClip.fadeIn || 0,
            fadeOut: sClip.fadeOut || 0,
            fadeOutCurve: sClip.fadeOutCurve || 0,
            reverb: sClip.reverb || 0
          }))
        };

        let tDur = 0;
        newTrack.clips.forEach(c => {
          tDur = Math.max(tDur, (c.startTime || 0) + (c.duration || 0));
        });
        newTrack.duration = tDur;

        tracks.push(newTrack);
        renderTrackRow(newTrack);
      });

      // 4. Update empty state or timeline duration
      if (tracks.length === 0) {
        emptyState.style.display = 'flex';
        globalPlayhead.style.display = 'none';
        maxDuration = 0;
        freeTimelineDuration = 0;
        currentPlayheadTime = 0;
        updatePlayheadPosition();
        notifyParent('ALL_TRACKS_REMOVED');
        notifyParent('TIME_UPDATE', { time: 0 });
      } else {
        emptyState.style.display = 'none';
        globalPlayhead.style.display = 'block';
        freeTimelineDuration = snapshot.freeTimelineDuration || 0;
        recalcMaxDuration();
        applyZoom();
        notifyParent('TRACK_ADDED', { count: tracks.length });
      }

      // 5. Restore selection
      if (snapshot.selectedClipIds && snapshot.selectedClipIds.length > 0) {
        selectMultipleClips(snapshot.selectedClipIds);
      } else if (snapshot.selectedClipId) {
        selectClip(snapshot.selectedClipId);
      } else {
        clearClipSelection();
      }

      // 6. Keep playhead bounded and position updated
      if (maxDuration > 0) {
        currentPlayheadTime = Math.min(currentPlayheadTime, maxDuration);
      } else {
        currentPlayheadTime = 0;
      }
      updatePlayheadPosition();
      notifyParent('TIME_UPDATE', { time: currentPlayheadTime });

      if (wasPlaying && tracks.length > 0) {
        startAllSources(currentPlayheadTime);
      }
    }

    function undo() {
      if (undoStack.length === 0) {
        showTimelineToast('Nothing to undo');
        return;
      }
      isPerformingUndoRedo = true;
      try {
        const currentSnapshot = captureSnapshot();
        redoStack.push(currentSnapshot);
        const previousSnapshot = undoStack.pop();
        restoreSnapshot(previousSnapshot);
        showTimelineToast('↺ Undo');
        notifyParent('HISTORY_STATE', { canUndo: undoStack.length > 0, canRedo: redoStack.length > 0 });
      } finally {
        isPerformingUndoRedo = false;
      }
    }

    function redo() {
      if (redoStack.length === 0) {
        showTimelineToast('Nothing to redo');
        return;
      }
      isPerformingUndoRedo = true;
      try {
        const currentSnapshot = captureSnapshot();
        undoStack.push(currentSnapshot);
        const nextSnapshot = redoStack.pop();
        restoreSnapshot(nextSnapshot);
        showTimelineToast('↻ Redo');
        notifyParent('HISTORY_STATE', { canUndo: undoStack.length > 0, canRedo: redoStack.length > 0 });
      } finally {
        isPerformingUndoRedo = false;
      }
    }

    let isMarqueeSelecting = false;
    let marqueeStartX = 0;
    let marqueeStartY = 0;
    let wasMarqueeDraggingJustNow = false;
    let marqueeAdditive = false;
    let marqueeInitialSelection = new Set();

    function startMarqueeSelection(e) {
      if (e.button !== 0) return;
      if (tracks.length === 0) return;

      marqueeStartX = e.clientX;
      marqueeStartY = e.clientY;
      isMarqueeSelecting = false;
      marqueeAdditive = e.ctrlKey || e.metaKey || e.shiftKey;
      marqueeInitialSelection = new Set(selectedClipIds);

      window.addEventListener('mousemove', onMarqueeMove);
      window.addEventListener('mouseup', onMarqueeEnd);
    }

    function onMarqueeMove(e) {
      const dx = e.clientX - marqueeStartX;
      const dy = e.clientY - marqueeStartY;

      if (!isMarqueeSelecting && Math.hypot(dx, dy) > 4) {
        isMarqueeSelecting = true;
        document.body.style.userSelect = 'none';
        if (marqueeEl) marqueeEl.style.display = 'block';
      }

      if (!isMarqueeSelecting) return;

      // Auto-scroll when near edges of rightColumn
      const colRect = rightColumn.getBoundingClientRect();
      const edgeThreshold = 35;
      if (e.clientX > colRect.right - edgeThreshold) {
        rightColumn.scrollLeft += 12;
      } else if (e.clientX < colRect.left + edgeThreshold) {
        rightColumn.scrollLeft = Math.max(0, rightColumn.scrollLeft - 12);
      }
      if (e.clientY > colRect.bottom - edgeThreshold) {
        rightColumn.scrollTop += 10;
        headersViewport.scrollTop = rightColumn.scrollTop;
      } else if (e.clientY < colRect.top + edgeThreshold) {
        rightColumn.scrollTop = Math.max(0, rightColumn.scrollTop - 10);
        headersViewport.scrollTop = rightColumn.scrollTop;
      }

      // Compute bounding box in gridContent coordinates
      const gridRect = gridContent.getBoundingClientRect();
      const currentX = e.clientX;
      const currentY = e.clientY;

      const clientLeft = Math.min(marqueeStartX, currentX);
      const clientTop = Math.min(marqueeStartY, currentY);
      const clientRight = Math.max(marqueeStartX, currentX);
      const clientBottom = Math.max(marqueeStartY, currentY);

      if (marqueeEl) {
        const elLeft = clientLeft - gridRect.left;
        const elTop = clientTop - gridRect.top;
        const elWidth = clientRight - clientLeft;
        const elHeight = clientBottom - clientTop;
        marqueeEl.style.left = `${elLeft}px`;
        marqueeEl.style.top = `${elTop}px`;
        marqueeEl.style.width = `${elWidth}px`;
        marqueeEl.style.height = `${elHeight}px`;
      }

      // Collision detection with clips
      const currentSelected = new Set(marqueeAdditive ? marqueeInitialSelection : []);

      tracks.forEach(t => {
        (t.clips || []).forEach(c => {
          const clipEl = c.element || document.getElementById(`clip-${c.id}`);
          if (!clipEl) return;
          const cRect = clipEl.getBoundingClientRect();

          const intersects = !(
            cRect.right < clientLeft ||
            cRect.left > clientRight ||
            cRect.bottom < clientTop ||
            cRect.top > clientBottom
          );

          if (intersects) {
            currentSelected.add(c.id);
          }
        });
      });

      // Update visual selection in real time (60fps)
      tracks.forEach(t => {
        (t.clips || []).forEach(c => {
          const isSelected = currentSelected.has(c.id);
          updateClipVisualSelection(c.id, isSelected);
        });
      });

      selectedClipIds.clear();
      currentSelected.forEach(id => selectedClipIds.add(id));
      selectedClipId = selectedClipIds.size > 0 ? Array.from(selectedClipIds)[selectedClipIds.size - 1] : null;
    }

    function onMarqueeEnd(e) {
      window.removeEventListener('mousemove', onMarqueeMove);
      window.removeEventListener('mouseup', onMarqueeEnd);

      if (marqueeEl) marqueeEl.style.display = 'none';
      document.body.style.userSelect = '';

      if (isMarqueeSelecting) {
        isMarqueeSelecting = false;
        wasMarqueeDraggingJustNow = true;
        setTimeout(() => {
          wasMarqueeDraggingJustNow = false;
        }, 100);

        if (selectedClipIds.size > 0) {
          notifyParent('CLIPS_SELECTED', { ids: Array.from(selectedClipIds), count: selectedClipIds.size, primaryId: selectedClipId });
          notifyParent('CLIP_SELECTED', { id: selectedClipId });
        } else {
          notifyParent('CLIP_DESELECTED');
        }
      } else {
        if (!marqueeAdditive) {
          clearClipSelection();
        }
      }
    }

    rightColumn.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.audio-clip') ||
          e.target.closest('.timeline-ruler-bar') ||
          e.target.closest('.global-playhead') ||
          e.target.closest('.empty-lane-placeholder') ||
          e.target.closest('button') ||
          e.target.closest('input')) {
        return;
      }
      startMarqueeSelection(e);
    });

    rightColumn.addEventListener('click', (e) => {
      if (wasMarqueeDraggingJustNow) return;
      if (e.target === rightColumn || e.target === wavesList || e.target === gridContent) {
        clearClipSelection();
      }
    });
    headersViewport.addEventListener('click', (e) => {
      if (e.target === headersViewport || e.target === headersList) {
        clearClipSelection();
      }
    });

    function redrawAll() {
      updateRuler();
      updateClipsLayout();
      updatePlayheadPosition();
    }

    let isScrubbing = false;
    let wasPlayingBeforeScrub = false;

    function getTimeFromClientX(clientX) {
      if (maxDuration <= 0) return 0;
      const rect = rulerBar.getBoundingClientRect();
      const offsetX = clientX - rect.left;
      const laneWidth = rect.width;
      if (laneWidth <= 0) return 0;
      const ratio = Math.max(0, Math.min(1, offsetX / laneWidth));
      return ratio * maxDuration;
    }

    function startScrubbing(e) {
      if (maxDuration <= 0) return;
      if (e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest('.audio-clip')) return;

      isScrubbing = true;
      wasPlayingBeforeScrub = isPlaying;
      if (isPlaying) {
        stopAllSources();
      }

      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ew-resize';

      const targetTime = getTimeFromClientX(e.clientX);
      currentPlayheadTime = targetTime;
      updatePlayheadPosition();
      notifyParent('TIME_UPDATE', { time: currentPlayheadTime });

      window.addEventListener('mousemove', onScrubMove);
      window.addEventListener('mouseup', onScrubEnd);
    }

    function onScrubMove(e) {
      if (!isScrubbing) return;
      const targetTime = getTimeFromClientX(e.clientX);
      currentPlayheadTime = targetTime;
      updatePlayheadPosition();
      notifyParent('TIME_UPDATE', { time: currentPlayheadTime });
    }

    function onScrubEnd(e) {
      if (!isScrubbing) return;
      isScrubbing = false;
      document.body.style.userSelect = '';
      document.body.style.cursor = '';

      window.removeEventListener('mousemove', onScrubMove);
      window.removeEventListener('mouseup', onScrubEnd);

      seekTo(currentPlayheadTime);
      if (wasPlayingBeforeScrub) {
        startAllSources(currentPlayheadTime);
      }
    }

    rulerBar.addEventListener('mousedown', startScrubbing);
    globalPlayhead.addEventListener('mousedown', startScrubbing);

    function seekTo(time) {
      currentPlayheadTime = Math.max(0, Math.min(maxDuration, time));
      updatePlayheadPosition();
      notifyParent('TIME_UPDATE', { time: currentPlayheadTime });

      if (isPlaying) {
        stopAllSources();
        startAllSources(currentPlayheadTime);
      }
    }

    function updatePlayheadPosition() {
      if (maxDuration <= 0) return;
      const currentLaneWidth = rulerBar.offsetWidth;
      const ratio = Math.max(0, Math.min(1, currentPlayheadTime / maxDuration));
      const leftPos = ratio * currentLaneWidth;
      globalPlayhead.style.left = `${leftPos}px`;
    }

    function isPlayheadOutsideView() {
      if (maxDuration <= 0) return false;
      const currentLaneWidth = rulerBar.offsetWidth;
      if (currentLaneWidth <= 0) return false;
      const ratio = Math.max(0, Math.min(1, currentPlayheadTime / maxDuration));
      const playheadX = ratio * currentLaneWidth;

      const viewLeft = rightColumn.scrollLeft;
      const viewWidth = rightColumn.clientWidth;
      const viewRight = viewLeft + viewWidth;

      return (playheadX < viewLeft) || (playheadX > viewRight);
    }

    function scrollPlayheadIntoView(forceCenter = false) {
      if (maxDuration <= 0) return;
      const currentLaneWidth = rulerBar.offsetWidth;
      if (currentLaneWidth <= 0) return;
      const ratio = Math.max(0, Math.min(1, currentPlayheadTime / maxDuration));
      const playheadX = ratio * currentLaneWidth;

      const viewLeft = rightColumn.scrollLeft;
      const viewWidth = rightColumn.clientWidth;
      const viewRight = viewLeft + viewWidth;

      const isOutside = (playheadX < viewLeft) || (playheadX > viewRight);

      if (isOutside || forceCenter) {
        const targetScrollLeft = Math.max(0, Math.round(playheadX - (viewWidth / 2)));
        rightColumn.scrollLeft = targetScrollLeft;
      }
    }

    function generateFadeCurveValues(type, tension, numPoints = 64, startU = 0) {
      const curve = new Float32Array(numPoints);
      const cGain = 0.5 + 0.5 * Math.max(-1, Math.min(1, tension));
      for (let i = 0; i < numPoints; i++) {
        const u = startU + (1 - startU) * (i / (numPoints - 1));
        if (type === 'in') {
          const g = (1 - u) * (1 - u) * 0 + 2 * (1 - u) * u * cGain + u * u * 1;
          curve[i] = Math.max(0, Math.min(1, g));
        } else {
          const g = (1 - u) * (1 - u) * 1 + 2 * (1 - u) * u * cGain + u * u * 0;
          curve[i] = Math.max(0, Math.min(1, g));
        }
      }
      return curve;
    }

    function startAllSources(offset = 0) {
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      stopAllSources();

      const now = audioContext.currentTime;

      tracks.forEach(track => {
        track.clips.forEach(clip => {
          const clipStart = clip.startTime || 0;
          const clipEnd = clipStart + clip.duration;

          if (offset < clipEnd) {
            const source = audioContext.createBufferSource();
            source.buffer = clip.buffer;

            const clipGainNode = audioContext.createGain();
            source.connect(clipGainNode);
            
            if (clip.reverb && clip.reverb > 0 && window.MuziroReverb) {
              const reverbAmt = clip.reverb / 100;
              const dryGain = audioContext.createGain();
              dryGain.gain.value = 1 - reverbAmt;
              const wetGain = audioContext.createGain();
              wetGain.gain.value = reverbAmt;
              
              const convolver = audioContext.createConvolver();
              convolver.buffer = window.MuziroReverb.getImpulseResponse(audioContext);
              
              clipGainNode.connect(dryGain);
              clipGainNode.connect(convolver);
              convolver.connect(wetGain);
              
              dryGain.connect(track.gainNode);
              wetGain.connect(track.gainNode);
            } else {
              clipGainNode.connect(track.gainNode);
            }

            const fadeIn = Math.max(0, Math.min(clip.duration, clip.fadeIn || 0));
            const fadeOut = Math.max(0, Math.min(clip.duration - fadeIn, clip.fadeOut || 0));

            let clipPlayStartTime;
            if (offset <= clipStart) {
              const delay = clipStart - offset;
              clipPlayStartTime = now + delay;
              source.start(clipPlayStartTime, 0);
            } else {
              const bufferOffset = offset - clipStart;
              clipPlayStartTime = now - bufferOffset;
              source.start(now, bufferOffset);
            }

            const clipPlayEndTime = clipPlayStartTime + clip.duration;

            // Schedule Gain Envelope for Fades:
            if (fadeIn <= 0 && fadeOut <= 0) {
              clipGainNode.gain.setValueAtTime(1, now);
            } else {
              // Fade In
              if (fadeIn > 0) {
                const fadeInEndTime = clipPlayStartTime + fadeIn;
                const inCurve = clip.fadeInCurve || 0;
                if (offset <= clipStart) {
                  if (Math.abs(inCurve) < 0.01) {
                    clipGainNode.gain.setValueAtTime(0, clipPlayStartTime);
                    clipGainNode.gain.linearRampToValueAtTime(1, fadeInEndTime);
                  } else {
                    const curveVals = generateFadeCurveValues('in', inCurve, 64, 0);
                    clipGainNode.gain.setValueCurveAtTime(curveVals, clipPlayStartTime, fadeIn);
                  }
                } else if (offset < clipStart + fadeIn) {
                  const curFraction = (offset - clipStart) / fadeIn;
                  const remainingDuration = fadeInEndTime - now;
                  if (remainingDuration > 0.01) {
                    if (Math.abs(inCurve) < 0.01) {
                      clipGainNode.gain.setValueAtTime(curFraction, now);
                      clipGainNode.gain.linearRampToValueAtTime(1, fadeInEndTime);
                    } else {
                      const curveVals = generateFadeCurveValues('in', inCurve, 64, curFraction);
                      clipGainNode.gain.setValueCurveAtTime(curveVals, now, remainingDuration);
                    }
                  }
                } else {
                  clipGainNode.gain.setValueAtTime(1, now);
                }
              } else {
                clipGainNode.gain.setValueAtTime(1, now);
              }

              // Fade Out
              if (fadeOut > 0) {
                const fadeOutStartTime = clipPlayEndTime - fadeOut;
                const fadeOutStartTimelineTime = clipEnd - fadeOut;
                const outCurve = clip.fadeOutCurve || 0;

                if (offset <= fadeOutStartTimelineTime) {
                  if (Math.abs(outCurve) < 0.01) {
                    clipGainNode.gain.setValueAtTime(1, fadeOutStartTime);
                    clipGainNode.gain.linearRampToValueAtTime(0, clipPlayEndTime);
                  } else {
                    const curveVals = generateFadeCurveValues('out', outCurve, 64, 0);
                    clipGainNode.gain.setValueCurveAtTime(curveVals, fadeOutStartTime, fadeOut);
                  }
                } else if (offset < clipEnd) {
                  const curFraction = (offset - fadeOutStartTimelineTime) / fadeOut;
                  const remainingDuration = clipPlayEndTime - now;
                  if (remainingDuration > 0.01) {
                    if (Math.abs(outCurve) < 0.01) {
                      const startGain = 1 - curFraction;
                      clipGainNode.gain.setValueAtTime(startGain, now);
                      clipGainNode.gain.linearRampToValueAtTime(0, clipPlayEndTime);
                    } else {
                      const curveVals = generateFadeCurveValues('out', outCurve, 64, curFraction);
                      clipGainNode.gain.setValueCurveAtTime(curveVals, now, remainingDuration);
                    }
                  }
                }
              }
            }

            activeSources.push({ source, gainNode: clipGainNode });
          }
        });
      });

      startTime = now - offset;
      isPlaying = true;
      notifyParent('PLAY_STATE', { isPlaying: true });
      notifyParent('TIME_UPDATE', { time: offset });
      runPlayheadLoop();
    }

    function stopAllSources() {
      activeSources.forEach(item => {
        if (item.source) {
          try { item.source.stop(); } catch (_) {}
          try { item.source.disconnect(); } catch (_) {}
        } else if (item.stop) {
          try { item.stop(); } catch (_) {}
          try { item.disconnect(); } catch (_) {}
        }
        if (item.gainNode) {
          try { item.gainNode.gain.cancelScheduledValues(audioContext.currentTime); } catch (_) {}
          try { item.gainNode.disconnect(); } catch (_) {}
        }
      });
      activeSources = [];
      const wasPlaying = isPlaying;
      isPlaying = false;
      if (animFrame) cancelAnimationFrame(animFrame);
      if (wasPlaying) {
        notifyParent('PLAY_STATE', { isPlaying: false });
      }
    }

    function updateLiveRecordingVisuals() {
      const recClip = document.getElementById('live-recording-clip');
      if (!recClip) return;
      const recStartTime = recClip._recStartTime || 0;
      const elapsed = Math.max(0, currentPlayheadTime - recStartTime);
      const laneWidth = rulerBar.offsetWidth;
      if (laneWidth <= 0 || maxDuration <= 0) return;

      const leftPx = (recStartTime / maxDuration) * laneWidth;
      const widthPx = (elapsed / maxDuration) * laneWidth;

      if (widthPx > 1) {
        recClip.style.display = 'flex';
        recClip.style.left = `${leftPx}px`;
        recClip.style.width = `${widthPx}px`;
      } else {
        recClip.style.display = 'none';
        recClip.style.left = `${leftPx}px`;
        recClip.style.width = '0px';
      }

      const timeTag = recClip.querySelector('.live-rec-tag');
      if (timeTag) {
        timeTag.style.display = widthPx >= 60 ? 'flex' : 'none';
        timeTag.textContent = `REC ${formatTime(elapsed)}`;
      }

      const bannerTimer = document.getElementById('banner-rec-timer');
      if (bannerTimer) {
        bannerTimer.textContent = formatTime(elapsed);
      }
    }

    function runPlayheadLoop() {
      if (!isPlaying) return;
      currentPlayheadTime = audioContext.currentTime - startTime;

      if (window.MuziroRecorder && window.MuziroRecorder.getIsRecording()) {
        updateLiveRecordingVisuals();
        if (currentPlayheadTime + 4 > maxDuration) {
          freeTimelineDuration = Math.max(freeTimelineDuration + 20, currentPlayheadTime + 20);
          maxDuration = freeTimelineDuration;
          applyZoom();
        }
        if (isPlayheadOutsideView()) {
          scrollPlayheadIntoView(true);
        }
      } else if (currentPlayheadTime >= maxDuration) {
        stopAllSources();
        currentPlayheadTime = 0;
        updatePlayheadPosition();
        rightColumn.scrollLeft = 0;
        notifyParent('TIME_UPDATE', { time: 0 });
        notifyParent('ended');
        return;
      }

      updatePlayheadPosition();
      notifyParent('TIME_UPDATE', { time: currentPlayheadTime });
      animFrame = requestAnimationFrame(runPlayheadLoop);
    }

    function play() {
      if (tracks.length === 0 || isPlaying) return;
      if (currentPlayheadTime >= maxDuration) currentPlayheadTime = 0;
      if (isPlayheadOutsideView()) {
        scrollPlayheadIntoView(true);
      }
      startAllSources(currentPlayheadTime);
    }

    function pause() {
      if (!isPlaying) return;
      if (window.MuziroRecorder && window.MuziroRecorder.getIsRecording()) {
        window.MuziroRecorder.stopRecording();
      }
      stopAllSources();
      if (isPlayheadOutsideView()) {
        scrollPlayheadIntoView(true);
      }
      notifyParent('TIME_UPDATE', { time: currentPlayheadTime });
    }

    function stop() {
      if (window.MuziroRecorder && window.MuziroRecorder.getIsRecording()) {
        window.MuziroRecorder.stopRecording();
      }
      stopAllSources();
      currentPlayheadTime = 0;
      updatePlayheadPosition();
      rightColumn.scrollLeft = 0;
      notifyParent('TIME_UPDATE', { time: 0 });
      notifyParent('PLAY_STATE', { isPlaying: false });
    }

    function handleZoom(deltaY, clientX) {
      if (tracks.length === 0 || maxDuration <= 0) return;

      const rightRect = rightColumn.getBoundingClientRect();
      const viewWidth = rightColumn.clientWidth;
      if (viewWidth <= 0) return;

      const currentLaneWidth = rulerBar.offsetWidth;
      if (currentLaneWidth <= 0) return;

      let anchorViewportX;
      let anchorTime;

      // Check if clientX is hovering over the rightColumn's visible lane area
      const isOverLane = (clientX !== undefined && clientX >= rightRect.left && clientX <= rightRect.right);

      if (isOverLane) {
        anchorViewportX = Math.max(0, Math.min(viewWidth, clientX - rightRect.left));
        const mouseInLaneX = anchorViewportX + rightColumn.scrollLeft;
        const timeRatio = Math.max(0, Math.min(1, mouseInLaneX / currentLaneWidth));
        anchorTime = timeRatio * maxDuration;
      } else {
        // Cursor is outside lane (e.g. over left track headers, top bar, or not provided).
        // Check if playhead is in visible viewport:
        const playheadRatio = Math.max(0, Math.min(1, currentPlayheadTime / maxDuration));
        const playheadLaneX = playheadRatio * currentLaneWidth;
        const playheadViewportX = playheadLaneX - rightColumn.scrollLeft;

        if (playheadViewportX >= 0 && playheadViewportX <= viewWidth) {
          // Playhead is visible: anchor zoom around playhead!
          anchorViewportX = playheadViewportX;
          anchorTime = currentPlayheadTime;
        } else {
          // Playhead not visible: anchor around center of the visible viewport
          anchorViewportX = viewWidth / 2;
          const centerInLaneX = anchorViewportX + rightColumn.scrollLeft;
          anchorTime = (centerInLaneX / currentLaneWidth) * maxDuration;
        }
      }

      const zoomFactor = deltaY < 0 ? 1.2 : (1 / 1.2);
      const newZoom = Math.max(1.0, Math.min(30.0, zoomLevel * zoomFactor));

      if (Math.abs(newZoom - zoomLevel) < 0.001) return;

      zoomLevel = newZoom;
      applyZoom();

      // Anchor zoom precisely around anchorTime at anchorViewportX
      const newLaneWidth = rulerBar.offsetWidth;
      const newAnchorInLaneX = (anchorTime / maxDuration) * newLaneWidth;
      const newScrollLeft = newAnchorInLaneX - anchorViewportX;
      rightColumn.scrollLeft = Math.max(0, Math.round(newScrollLeft));
    }

    function notifyParent(action, payload) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'MUZIRO_TIMELINE', action, payload }, '*');
      }
    }

    window.addEventListener('resize', () => {
      applyZoom();
    });

    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        handleZoom(e.deltaY, e.clientX);
      }
    }, { passive: false });

    function toggleRecord() {
      if (!window.MuziroRecorder) return;
      if (window.MuziroRecorder.getIsRecording() || window.MuziroRecorder.getIsCountingDown()) {
        window.MuziroRecorder.stopRecording();
        return;
      }
      let targetTrack = tracks.find(t => t.id === selectedTrackId);
      if (!targetTrack && tracks.length > 0) {
        targetTrack = tracks[0];
        selectTrack(targetTrack.id);
      }
      if (!targetTrack) return;
      window.MuziroRecorder.requestRecording(targetTrack.id, targetTrack.name);
    }

    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('confirm-modal-overlay');
      const isModalOpen = modal && modal.classList.contains('is-active');
      if (isModalOpen) {
        if (e.key === 'Escape') {
          e.preventDefault();
          closeConfirmModal();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (trackToDelete) {
            const t = trackToDelete;
            closeConfirmModal();
            deleteTrack(t);
          }
        }
        return;
      }

      const activeTag = document.activeElement ? document.activeElement.tagName : '';
      if (activeTag === 'TEXTAREA' || (activeTag === 'INPUT' && document.activeElement.type !== 'range')) return;

      // Record: R (or Russian К)
      if (!e.ctrlKey && !e.metaKey && !e.altKey && (e.code === 'KeyR' || e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 'к')) {
        e.preventDefault();
        toggleRecord();
        return;
      }

      // Undo: Ctrl+Z (without Shift)
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.code === 'KeyZ' || e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'я')) {
        e.preventDefault();
        undo();
        return;
      }

      // Redo: Ctrl+Shift+Z or Ctrl+Y
      if (((e.ctrlKey || e.metaKey) && e.shiftKey && !e.altKey && (e.code === 'KeyZ' || e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'я')) ||
          ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.code === 'KeyY' || e.key.toLowerCase() === 'y' || e.key.toLowerCase() === 'н'))) {
        e.preventDefault();
        redo();
        return;
      }

      // Save: Ctrl+S (and Russian Ctrl+Ы)
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.code === 'KeyS' || e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'ы')) {
        e.preventDefault();
        notifyParent('REQUEST_SAVE', { state: getProjectState() });
        return;
      }

      // Select All: Ctrl+A or Ctrl+Ф
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.code === 'KeyA' || e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'ф')) {
        e.preventDefault();
        selectAllClips();
        return;
      }

      // Deselect: Escape
      if (e.key === 'Escape') {
        clearClipSelection();
        return;
      }

      if (e.key === 'Backspace' || e.key === 'Delete') {
        if (selectedClipId || selectedClipIds.size > 0) {
          e.preventDefault();
          deleteSelectedClip();
        }
      } else if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyB' || e.key.toLowerCase() === 'b' || e.key.toLowerCase() === 'и')) {
        e.preventDefault();
        splitSelectedTrack();
      } else if (!e.ctrlKey && !e.metaKey && !e.altKey && (e.code === 'KeyQ' || e.key.toLowerCase() === 'q' || e.key.toLowerCase() === 'й')) {
        e.preventDefault();
        trimStartToPlayhead();
      } else if (!e.ctrlKey && !e.metaKey && !e.altKey && (e.code === 'KeyW' || e.key.toLowerCase() === 'w' || e.key.toLowerCase() === 'ц')) {
        e.preventDefault();
        trimEndToPlayhead();
      } else if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
        e.preventDefault();
        e.stopPropagation();
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
        if (window.MuziroRecorder && (window.MuziroRecorder.getIsRecording() || window.MuziroRecorder.getIsCountingDown())) {
          window.MuziroRecorder.stopRecording();
          return;
        }
        if (isPlaying) {
          pause();
        } else {
          play();
        }
      }
    });

    // Initialize Add Track Section UI
    const addAudioTrackBtn = document.getElementById('add-audio-track-btn');
    const addTrackDropdownBtn = document.getElementById('add-track-dropdown-btn');
    const addTrackMenu = document.getElementById('add-track-menu');
    const addTrackFileInput = document.getElementById('add-track-file-input');
    const menuImportAudio = document.getElementById('menu-import-audio');
    const menuEmptyTrack = document.getElementById('menu-empty-track');
    const addTrackBtnGroup = document.getElementById('add-track-btn-group');
    const addTrackSection = document.getElementById('add-track-section');

    function toggleAddTrackMenu() {
      if (addTrackMenu) addTrackMenu.classList.toggle('is-open');
    }

    function openAddTrackMenu() {
      if (addTrackMenu) addTrackMenu.classList.add('is-open');
    }

    function closeAddTrackMenu() {
      if (addTrackMenu) addTrackMenu.classList.remove('is-open');
    }

    if (addAudioTrackBtn) {
      addAudioTrackBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeAddTrackMenu();
        if (addTrackFileInput) {
          addTrackFileInput.value = '';
          addTrackFileInput.click();
        }
      });

      addAudioTrackBtn.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openAddTrackMenu();
      });
    }

    if (addTrackDropdownBtn) {
      addTrackDropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAddTrackMenu();
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#add-track-section')) {
        closeAddTrackMenu();
      }
    });

    if (menuImportAudio) {
      menuImportAudio.addEventListener('click', (e) => {
        e.stopPropagation();
        closeAddTrackMenu();
        if (addTrackFileInput) {
          addTrackFileInput.value = '';
          addTrackFileInput.click();
        }
      });
    }

    if (menuEmptyTrack) {
      menuEmptyTrack.addEventListener('click', (e) => {
        e.stopPropagation();
        closeAddTrackMenu();
        createEmptyTrack();
      });
    }

    if (addTrackFileInput) {
      addTrackFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          loadAudioFile(file);
        }
      });
    }

    if (addTrackSection) {
      addTrackSection.addEventListener('dragover', (e) => {
        if (e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files')) {
          e.preventDefault();
          if (addTrackBtnGroup) addTrackBtnGroup.classList.add('is-dragover');
        }
      });
      addTrackSection.addEventListener('dragleave', () => {
        if (addTrackBtnGroup) addTrackBtnGroup.classList.remove('is-dragover');
      });
      addTrackSection.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          e.preventDefault();
          if (addTrackBtnGroup) addTrackBtnGroup.classList.remove('is-dragover');
          loadAudioFile(e.dataTransfer.files[0]);
        }
      });
    }

    // Modal event listeners
    const confirmModalOverlay = document.getElementById('confirm-modal-overlay');
    const confirmModalCancel = document.getElementById('confirm-modal-cancel');
    const confirmModalConfirm = document.getElementById('confirm-modal-confirm');

    if (confirmModalCancel) {
      confirmModalCancel.addEventListener('click', (e) => {
        e.stopPropagation();
        closeConfirmModal();
      });
    }

    if (confirmModalConfirm) {
      confirmModalConfirm.addEventListener('click', (e) => {
        e.stopPropagation();
        if (trackToDelete) {
          const t = trackToDelete;
          closeConfirmModal();
          deleteTrack(t);
        } else {
          closeConfirmModal();
        }
      });
    }

    if (confirmModalOverlay) {
      confirmModalOverlay.addEventListener('click', (e) => {
        if (e.target === confirmModalOverlay) {
          closeConfirmModal();
        }
      });
    }

    // Sync vertical wheel scrolling on left headers viewport
    if (headersViewport) {
      headersViewport.addEventListener('wheel', (e) => {
        rightColumn.scrollTop += e.deltaY;
        headersViewport.scrollTop = rightColumn.scrollTop;
      }, { passive: true });
    }

    // Public API exposed for parent frame / direct scripting
    window.MuziroTimeline = {
      addTrack,
      createEmptyTrack,
      loadAudioFile,
      confirmDeleteTrack,
      deleteTrack,
      undo,
      redo,
      canUndo: () => undoStack.length > 0,
      canRedo: () => redoStack.length > 0,
      play,
      pause,
      stop,
      seekTo,
      handleZoom,
      splitSelectedTrack,
      deleteSelectedClip,
      selectAllClips,
