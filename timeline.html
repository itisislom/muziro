      clearClipSelection,
      selectMultipleClips,
      getSelectedClipIds: () => Array.from(selectedClipIds),
      trimStartToPlayhead,
      trimEndToPlayhead,
      startTrimDrag,
      isDraggingTrim: () => isDraggingTrim,
      scrollPlayheadIntoView,
      getTrackCount: () => tracks.length,
      isPlaying: () => isPlaying
    };

    // Expose Reverb Bridge for seamless DSP effect control
    window.MuziroReverbBridge = {
      getClipReverb: (clipId) => {
        for (const t of tracks) {
          for (const c of (t.clips || [])) {
            if (c.id === clipId) return c.reverb || 0;
          }
        }
        return 0;
      },
      applyReverb: (clipId, reverbValue) => {
        let foundClip = null;
        outer: for (const t of tracks) {
          for (const c of (t.clips || [])) {
            if (c.id === clipId) {
              foundClip = c;
              break outer;
            }
          }
        }
        if (!foundClip) return;

        pushHistorySnapshot();
        foundClip.reverb = Math.max(0, Math.min(100, Math.round(Number(reverbValue) || 0)));

        // If currently playing, restart audio playback at current playhead to apply new reverb mix in real-time
        if (isPlaying) {
          startAllSources(currentPlayheadTime);
        }

        notifyParent('TIMELINE_MUTATED');
        showTimelineToast(`Reverb: ${foundClip.reverb}%`);
      }
    };

    // Expose Timeline Recording Bridge
    window.MuziroTimelineBridge = {
      onRecordingStarted: (trackId) => {
        const targetTrack = tracks.find(t => t.id === trackId);
        if (!targetTrack) return currentPlayheadTime;

        if (maxDuration <= 0) {
          freeTimelineDuration = 60;
          maxDuration = freeTimelineDuration;
          applyZoom();
        }
        emptyState.style.display = 'none';
        globalPlayhead.style.display = 'block';

        const recStartTime = currentPlayheadTime;

        // Visual indicator on armed track's R button
        const recBtn = document.getElementById(`btn-rec-${trackId}`);
        if (recBtn) recBtn.classList.add('is-recording');

        // Remove placeholder if track was empty
        const lane = targetTrack.waveLane || document.getElementById(`lane-${trackId}`);
        if (lane) {
          const ph = lane.querySelector('.empty-lane-placeholder');
          if (ph) ph.style.display = 'none';

          const oldRec = document.getElementById('live-recording-clip');
          if (oldRec) oldRec.remove();

          const recEl = document.createElement('div');
          recEl.className = 'live-recording-clip';
          recEl.id = 'live-recording-clip';
          recEl._recStartTime = recStartTime;
          const currentLaneW = rulerBar.offsetWidth || 1;
          const initialLeft = maxDuration > 0 ? (recStartTime / maxDuration) * currentLaneW : 0;
          recEl.style.left = `${initialLeft}px`;
          recEl.style.width = '0px';
          recEl.style.display = 'none';
          recEl.innerHTML = `
            <div class="live-rec-tag" style="display: none;">
              <div class="live-rec-dot"></div>
              <span class="live-rec-timer">REC 00:00.0</span>
            </div>
          `;
          lane.appendChild(recEl);
        }

        // Add top recording status pill
        const oldBanner = document.getElementById('timeline-rec-banner');
        if (oldBanner) oldBanner.remove();

        const banner = document.createElement('div');
        banner.className = 'timeline-rec-banner';
        banner.id = 'timeline-rec-banner';
        banner.innerHTML = `
          <div class="timeline-rec-banner-text">
            <div class="live-rec-dot"></div>
            <span>REC ON ${targetTrack.name.toUpperCase()}</span>
            <span id="banner-rec-timer">00:00.0</span>
          </div>
          <button class="timeline-rec-banner-stop-btn" id="btn-banner-stop-rec">■ Stop</button>
        `;
        banner.querySelector('#btn-banner-stop-rec').addEventListener('click', (e) => {
          e.stopPropagation();
          if (window.MuziroRecorder) window.MuziroRecorder.stopRecording();
        });
        gridContent.appendChild(banner);

        // Start backing playback of all audio tracks at current playhead time
        startAllSources(recStartTime);

        notifyParent('RECORDING_STARTED', { trackId, startTime: recStartTime });
        return recStartTime;
      },

      onRecordingCancelled: (trackId) => {
        cleanupRecordingVisuals(trackId);
        stopAllSources();
        notifyParent('RECORDING_CANCELLED');
      },

      onRecordingFinished: (trackId, audioBuffer, startTime) => {
        cleanupRecordingVisuals(trackId);
        stopAllSources();

        const targetTrack = tracks.find(t => t.id === trackId);
        if (!targetTrack || !audioBuffer) return;

        pushHistorySnapshot();

        const clipId = 'clip_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const newClip = {
          id: clipId,
          name: `Voice ${targetTrack.clips.length + 1}`,
          startTime: Math.round(startTime * 1000) / 1000,
          duration: Math.round(audioBuffer.duration * 1000) / 1000,
          buffer: audioBuffer,
          sourceBuffer: audioBuffer,
          sourceOffset: 0,
          fadeIn: 0,
          fadeOut: 0,
          fadeInCurve: 0,
          fadeOutCurve: 0,
          reverb: 0
        };

        targetTrack.clips.push(newClip);
        recalcMaxDuration();
        renderTrackClips(targetTrack);
        applyZoom();
        updateClipsLayout();
        selectClip(clipId);

        showTimelineToast(`● Recorded ${newClip.duration.toFixed(1)}s to "${targetTrack.name}"`);
        notifyParent('TIMELINE_MUTATED');
        notifyParent('RECORDING_FINISHED', { trackId, clipId, duration: newClip.duration });
      }
    };

    function cleanupRecordingVisuals(trackId) {
      if (trackId) {
        const recBtn = document.getElementById(`btn-rec-${trackId}`);
        if (recBtn) recBtn.classList.remove('is-recording');
      }
      document.querySelectorAll('.track-record-btn').forEach(b => b.classList.remove('is-recording'));

      const recEl = document.getElementById('live-recording-clip');
      if (recEl) recEl.remove();

      const banner = document.getElementById('timeline-rec-banner');
      if (banner) banner.remove();

      tracks.forEach(t => {
        if (t.clips.length === 0 && t.waveLane) {
          const ph = t.waveLane.querySelector('.empty-lane-placeholder');
          if (ph) ph.style.display = 'flex';
        }
      });
    }

    // Also listen to custom event as an additional safety net
    window.addEventListener('muziro:apply-reverb', (e) => {
      if (e.detail && e.detail.clipId) {
        window.MuziroReverbBridge.applyReverb(e.detail.clipId, e.detail.reverb);
      }
    });

    // Also expose global window helpers for backwards compatibility
    window.tracks = tracks;
    window.pushHistorySnapshot = pushHistorySnapshot;
    window.startAllSources = startAllSources;
    window.getCurrentPlayheadTime = () => currentPlayheadTime;
    window.getIsPlaying = () => isPlaying;

    window.addEventListener('message', async (e) => {
      const data = e.data;
      if (!data || data.target !== 'MUZIRO_TIMELINE') return;

      if (data.action === 'ADD_TRACK') {
        await addTrack(data.buffer, data.name);
        notifyParent('TRACK_ADDED', { count: tracks.length });
      } else if (data.action === 'CREATE_EMPTY_TRACK') {
        createEmptyTrack(data.name);
      } else if (data.action === 'LOAD_AUDIO_FILE') {
        loadAudioFile(data.file);
      } else if (data.action === 'PLAY') {
        play();
      } else if (data.action === 'PAUSE') {
        pause();
      } else if (data.action === 'TOGGLE_PLAY') {
        if (isPlaying) {
          pause();
        } else {
          play();
        }
      } else if (data.action === 'TOGGLE_RECORD') {
        toggleRecord();
      } else if (data.action === 'SELECT_TRACK') {
        selectTrack(data.trackId);
      } else if (data.action === 'STOP' || data.action === 'RESET') {
        stop();
      } else if (data.action === 'SCROLL_TO_PLAYHEAD') {
        scrollPlayheadIntoView(true);
      } else if (data.action === 'ZOOM_WHEEL') {
        handleZoom(data.deltaY, data.clientX);
      } else if (data.action === 'SPLIT_MIDDLE') {
        splitSelectedTrack();
      } else if (data.action === 'TRIM_START') {
        trimStartToPlayhead();
      } else if (data.action === 'TRIM_END') {
        trimEndToPlayhead();
      } else if (data.action === 'DELETE_SELECTED') {
        deleteSelectedClip();
      } else if (data.action === 'DELETE_TRACK') {
        const targetTrack = tracks.find(t => t.id === data.trackId);
        if (targetTrack) {
          if (data.confirm === false) {
            deleteTrack(targetTrack);
          } else {
            confirmDeleteTrack(targetTrack);
          }
        }
      } else if (data.action === 'SELECT_ALL') {
        selectAllClips();
      } else if (data.action === 'DESELECT_ALL') {
        clearClipSelection();
      } else if (data.action === 'UNDO') {
        undo();
      } else if (data.action === 'REDO') {
        redo();
      } else if (data.action === 'MOUSE_MOVE' || data.action === 'SCRUB_MOVE') {
        if (isMarqueeSelecting && data.clientX !== undefined) {
          onMarqueeMove({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isScrubbing && data.clientX !== undefined) {
          onScrubMove({ clientX: data.clientX });
        }
        if (isDraggingClip || draggedClip) {
          onClipDragMove({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingTrack || draggedTrack) {
          onTrackDragMove({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingFade) {
          onFadeDragMove({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingFadeCurve) {
          onFadeCurveDragMove({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingTrim) {
          onTrimDragMove({ clientX: data.clientX, clientY: data.clientY });
        }
      } else if (data.action === 'MOUSE_UP' || data.action === 'SCRUB_END') {
        if (isMarqueeSelecting) {
          onMarqueeEnd({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isScrubbing) {
          onScrubEnd();
        }
        if (isDraggingClip || draggedClip) {
          onClipDragEnd({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingTrack || draggedTrack) {
          onTrackDragEnd({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingFade) {
          onFadeDragEnd({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingFadeCurve) {
          onFadeCurveDragEnd({ clientX: data.clientX, clientY: data.clientY });
        }
        if (isDraggingTrim) {
          onTrimDragEnd({ clientX: data.clientX, clientY: data.clientY });
        }
      } else if (data.action === 'AUTOSAVE_PROJECT_TO_DB') {
        try {
          if (!data.projectId || tracks.length === 0) return;
          const record = await serializeTimelineProject(data.projectId, data.projectName, data.isDraft !== undefined ? Boolean(data.isDraft) : true);
          const totalClips = tracks.reduce((acc, t) => acc + (t.clips ? t.clips.length : 0), 0);
          notifyParent('PROJECT_AUTOSAVED', {
            id: record.id,
            name: record.name,
            isDraft: Boolean(record.isDraft),
            tracksCount: tracks.length,
            clipsCount: totalClips,
            duration: formatTime(maxDuration)
          });
        } catch (err) {
          console.error('Failed to autosave project to IndexedDB:', err);
        }
      } else if (data.action === 'SAVE_PROJECT_TO_DB') {
        try {
          const record = await serializeTimelineProject(data.projectId, data.projectName, false);
          const totalClips = tracks.reduce((acc, t) => acc + (t.clips ? t.clips.length : 0), 0);
          notifyParent('PROJECT_SAVED', {
            id: record.id,
            name: record.name,
            isDraft: false,
            tracksCount: tracks.length,
            clipsCount: totalClips,
            duration: formatTime(maxDuration)
          });
        } catch (err) {
          console.error('Failed to save project to IndexedDB:', err);
        }
      } else if (data.action === 'LOAD_PROJECT_FROM_DB') {
        try {
          const record = await loadProjectRecord(data.projectId);
          if (record) {
            await deserializeAndRestoreProject(record);
          }
        } catch (err) {
          console.error('Failed to load project from IndexedDB:', err);
        }
      } else if (data.action === 'RENAME_PROJECT') {
        try {
          if (data.projectId && data.newName) {
            const record = await loadProjectRecord(data.projectId);
            if (record) {
              record.name = data.newName;
              record.updatedAt = Date.now();
              await saveProjectRecord(record);
            }
          }
        } catch (err) {
          console.error('Failed to rename project in IndexedDB:', err);
        }
      } else if (data.action === 'GET_PROJECT_STATE') {
        notifyParent('PROJECT_STATE', { state: getProjectState() });
      } else if (data.action === 'EXPORT_PROJECT') {
        const payload = data.payload || {};
        const projectName = payload.projectName || 'Muziro_Mixdown';
        const format = (payload.format || 'wav').toLowerCase();
        const sampleRate = Number(payload.sampleRate) || 44100;
        const channels = Number(payload.channels) === 1 ? 1 : 2;
        const bitDepth = Number(payload.bitDepth) || 16;
        const bitrate = Number(payload.bitrate) || 320;

        try {
          if (!tracks || tracks.length === 0 || !tracks.some(t => t.clips && t.clips.length > 0)) {
            notifyParent('EXPORT_ERROR', { message: 'No audio tracks to export' });
            return;
          }

          notifyParent('EXPORT_PROGRESS', { progress: 15, status: `Compiling audio timeline (${sampleRate / 1000} kHz)...` });

          if (typeof MuziroExport === 'undefined') {
            notifyParent('EXPORT_ERROR', { message: 'Export engine module not loaded.' });
            return;
          }

          notifyParent('EXPORT_PROGRESS', { progress: 35, status: `Resampling & rendering DSP mixdown (${channels === 1 ? 'Mono' : 'Stereo'})...` });

          MuziroExport.renderTimelineTracks(tracks, {
            sampleRate: sampleRate,
            channels: channels
          })
            .then(async renderedBuffer => {
              const specDesc = (format === 'wav' || format === 'aiff' || format === 'flac')
                ? `${bitDepth}-bit`
                : `${bitrate} kbps`;
              notifyParent('EXPORT_PROGRESS', {
                progress: 75,
                status: `Encoding ${format.toUpperCase()} (${specDesc})...`
              });

              await new Promise(r => setTimeout(r, 60));

              const exportedBlob = await MuziroExport.exportAudioBuffer(renderedBuffer, {
                format: format,
                bitDepth: bitDepth,
                bitrate: bitrate
              });

              notifyParent('EXPORT_PROGRESS', { progress: 95, status: 'Preparing file download...' });
              await new Promise(r => setTimeout(r, 60));

              const extMap = {
                wav: '.wav',
                mp3: '.mp3',
                flac: '.flac',
                ogg: '.ogg',
                aiff: '.aiff',
                aac: '.m4a',
                webm: '.webm'
              };
              const ext = extMap[format] || `.${format}`;
              const safeName = (projectName || 'Muziro_Mixdown').replace(/[/\\?%*:|"<>]/g, '_').trim() || 'Muziro_Mixdown';
              const cleanBase = safeName.replace(/\.[a-zA-Z0-9]+$/, '');
              const filename = `${cleanBase}${ext}`;

              MuziroExport.downloadBlob(exportedBlob, filename);
              notifyParent('EXPORT_SUCCESS', { filename });
            })
            .catch(err => {
              console.error('Export rendering failed:', err);
              notifyParent('EXPORT_ERROR', { message: err.message || 'Export rendering failed.' });
            });
        } catch (err) {
          console.error('Export request error:', err);
          notifyParent('EXPORT_ERROR', { message: err.message || 'Export failed.' });
        }
      }
    });

    /* ==========================================================================
       IndexedDB Project & Audio Persistence Engine
       ========================================================================== */
    const MUZIRO_DB_NAME = 'MuziroDB';
    const MUZIRO_DB_VERSION = 1;
    const MUZIRO_STORE_NAME = 'projects';

    function openMuziroDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(MUZIRO_DB_NAME, MUZIRO_DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(MUZIRO_STORE_NAME)) {
            db.createObjectStore(MUZIRO_STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveProjectRecord(record) {
      const db = await openMuziroDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(MUZIRO_STORE_NAME, 'readwrite');
        const store = tx.objectStore(MUZIRO_STORE_NAME);
        const req = store.put(record);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
      });
    }

    async function loadProjectRecord(projectId) {
      const db = await openMuziroDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(MUZIRO_STORE_NAME, 'readonly');
        const store = tx.objectStore(MUZIRO_STORE_NAME);
        const req = store.get(projectId);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
      });
    }

    let _audioBufferIdCounter = 0;
    function getOrAssignBufferId(buf) {
      if (!buf) return null;
      if (!buf._muziroId) {
        buf._muziroId = 'buf_' + (++_audioBufferIdCounter) + '_' + Date.now();
      }
      return buf._muziroId;
    }

    function extractAudioBufferData(audioBuf) {
      if (!audioBuf) return null;
      const channels = [];
      for (let ch = 0; ch < audioBuf.numberOfChannels; ch++) {
        channels.push(new Float32Array(audioBuf.getChannelData(ch)));
      }
      return {
        numberOfChannels: audioBuf.numberOfChannels,
        sampleRate: audioBuf.sampleRate,
        length: audioBuf.length,
        channels: channels
      };
    }

    function restoreAudioBufferFromData(ctx, data) {
      if (!data || !data.channels || data.channels.length === 0) return null;
      try {
        const buf = ctx.createBuffer(data.numberOfChannels, data.length, data.sampleRate);
        for (let ch = 0; ch < data.numberOfChannels; ch++) {
          if (data.channels[ch]) {
            buf.getChannelData(ch).set(data.channels[ch]);
          }
        }
        return buf;
      } catch (err) {
        console.error('Failed to restore AudioBuffer:', err);
        return null;
      }
    }

    async function serializeTimelineProject(projectId, projectName, isDraft = false) {
      const buffersStore = {};

      tracks.forEach(t => {
        (t.clips || []).forEach(c => {
          const buf = c.buffer;
          const sBuf = c.sourceBuffer || c.buffer;

          const bufId = getOrAssignBufferId(buf);
          const sBufId = getOrAssignBufferId(sBuf);

          if (bufId && !buffersStore[bufId]) {
            buffersStore[bufId] = extractAudioBufferData(buf);
          }
          if (sBufId && !buffersStore[sBufId]) {
            buffersStore[sBufId] = extractAudioBufferData(sBuf);
          }
        });
      });

      const serializedTracks = tracks.map(t => ({
        id: t.id,
        name: t.name,
        volume: t.volume !== undefined ? t.volume : 100,
        clips: (t.clips || []).map(c => ({
          id: c.id,
          name: c.name,
          startTime: c.startTime,
          duration: c.duration,
          sourceOffset: c.sourceOffset || 0,
          fadeIn: c.fadeIn || 0,
          fadeOut: c.fadeOut || 0,
          fadeInCurve: c.fadeInCurve || 0,
          fadeOutCurve: c.fadeOutCurve || 0,
          reverb: c.reverb || 0,
          bufferId: getOrAssignBufferId(c.buffer),
          sourceBufferId: getOrAssignBufferId(c.sourceBuffer || c.buffer)
        }))
      }));

      const record = {
        id: projectId,
        name: projectName || 'Untitled Project',
        isDraft: Boolean(isDraft),
        updatedAt: Date.now(),
        maxDuration: maxDuration,
        freeTimelineDuration: freeTimelineDuration,
        tracks: serializedTracks,
        buffers: buffersStore
      };

      await saveProjectRecord(record);
      return record;
    }

    async function deserializeAndRestoreProject(record) {
      if (!record || !Array.isArray(record.tracks)) return;

      const wasPlaying = isPlaying;
      if (isPlaying) {
        stopAllSources();
      }

      // Recreate AudioBuffers
      const bufferCache = {};
      if (record.buffers) {
        for (const [bId, bData] of Object.entries(record.buffers)) {
          const recreatedBuf = restoreAudioBufferFromData(audioContext, bData);
          if (recreatedBuf) {
            recreatedBuf._muziroId = bId;
            bufferCache[bId] = recreatedBuf;
          }
        }
      }

      // Disconnect existing tracks
      tracks.forEach(t => {
        if (t.gainNode) {
          try { t.gainNode.disconnect(); } catch (e) {}
        }
      });
      headersList.innerHTML = '';
      wavesList.innerHTML = '';
      tracks.length = 0;

      // Reconstruct tracks
      record.tracks.forEach(sTrack => {
        const gainNode = audioContext.createGain();
        const vol = sTrack.volume !== undefined ? sTrack.volume : 100;
        gainNode.gain.value = vol / 100;
        gainNode.connect(audioContext.destination);

        const newTrack = {
          id: sTrack.id,
          name: sTrack.name,
          duration: 0,
          gainNode: gainNode,
          volume: vol,
          clips: (sTrack.clips || []).map(sClip => {
            const buf = sClip.bufferId ? bufferCache[sClip.bufferId] : null;
            const sBuf = sClip.sourceBufferId ? bufferCache[sClip.sourceBufferId] : buf;
            return {
              id: sClip.id,
              name: sClip.name,
              startTime: sClip.startTime,
              duration: sClip.duration,
              buffer: buf,
              sourceBuffer: sBuf || buf,
              sourceOffset: sClip.sourceOffset || 0,
              fadeIn: sClip.fadeIn || 0,
              fadeOut: sClip.fadeOut || 0,
              fadeInCurve: sClip.fadeInCurve || 0,
              fadeOutCurve: sClip.fadeOutCurve || 0,
              reverb: sClip.reverb || 0
            };
          })
        };

        let tDur = 0;
        newTrack.clips.forEach(c => {
          tDur = Math.max(tDur, (c.startTime || 0) + (c.duration || 0));
        });
        newTrack.duration = tDur;

        tracks.push(newTrack);
        renderTrackRow(newTrack);
      });

      if (tracks.length === 0) {
        emptyState.style.display = 'flex';
        globalPlayhead.style.display = 'none';
        maxDuration = 0;
        freeTimelineDuration = 0;
        currentPlayheadTime = 0;
        updatePlayheadPosition();
        notifyParent('ALL_TRACKS_REMOVED');
      } else {
        emptyState.style.display = 'none';
        globalPlayhead.style.display = 'block';
        freeTimelineDuration = record.freeTimelineDuration || 0;
        recalcMaxDuration();
        applyZoom();

        // Reset undo/redo history for loaded project
        undoStack.length = 0;
        redoStack.length = 0;
        notifyParent('HISTORY_STATE', { canUndo: false, canRedo: false });

        // Multi-frame layout recalibration ensuring waveforms and clip widths render with absolute precision
        requestAnimationFrame(() => {
          recalcMaxDuration();
          applyZoom();
          if (tracks[0] && tracks[0].clips && tracks[0].clips[0]) {
            selectClip(tracks[0].clips[0].id);
          }
        });
        setTimeout(() => {
          recalcMaxDuration();
          applyZoom();
        }, 80);

        notifyParent('TRACK_ADDED', { count: tracks.length });
        notifyParent('PROJECT_LOADED', {
          id: record.id,
          name: record.name,
          tracksCount: tracks.length,
          duration: maxDuration
        });
      }
    }

    // Auto-restore project if opened with ?project=query_param
    function initAutoLoadProject() {
      const autoLoadProjectId = new URLSearchParams(window.location.search).get('project');
      if (autoLoadProjectId) {
        loadProjectRecord(autoLoadProjectId).then(record => {
          if (record) {
            deserializeAndRestoreProject(record);
          }
          notifyParent('TIMELINE_READY', { tracksCount: tracks.length });
        }).catch(err => {
          console.error('Auto-load project error:', err);
          notifyParent('TIMELINE_READY', { tracksCount: tracks.length });
        });
      } else {
        notifyParent('TIMELINE_READY', { tracksCount: tracks.length });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAutoLoadProject);
    } else {
      initAutoLoadProject();
    }

    function getProjectState() {
      return {
        tracksCount: tracks.length,
        clipsCount: tracks.reduce((acc, t) => acc + (t.clips ? t.clips.length : 0), 0),
        maxDuration: maxDuration,
        freeTimelineDuration: freeTimelineDuration,
        tracks: tracks.map(t => ({
          id: t.id,
          name: t.name,
          volume: t.volume !== undefined ? t.volume : 100,
          clips: (t.clips || []).map(c => ({
            id: c.id,
            name: c.name,
            startTime: c.startTime,
            duration: c.duration,
            sourceOffset: c.sourceOffset || 0,
            fadeIn: c.fadeIn || 0,
            fadeOut: c.fadeOut || 0,
            reverb: c.reverb || 0
          }))
        }))
      };
    }
  </script>
